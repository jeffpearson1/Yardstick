#####################################
# YARDSTICK CONFIG
#####################################
# The easiest way to create this file is to run .\Install-Yardstick.ps1, which
# copies it to Local\preferences.yaml and fills in the few values that have no
# sensible default.
#
# Every setting has a built-in default, so you only need to keep the lines you want
# to change. Anything omitted or left blank uses the default shown here. Run
# .\Test-YardstickSetup.ps1 at any time to check this file.


#####################################
# FOLDER LOCATIONS
#####################################
# Relative paths are resolved against the Yardstick folder. Absolute and UNC paths
# (\\server\share\...) are used as-is, and %ENVIRONMENT% variables are expanded.
# The defaults below follow the standard repository layout; uncomment a line only to
# move that folder somewhere else. Missing working folders are created on each run.
# Recipes: Recipes
# Icons: Icons
# Scripts: Scripts
# Tools: Tools
# Buildspace: Artifacts\BuildSpace
# Published: Artifacts\Packages
# Temp: Artifacts\Temp
# Secrets: Local\Secrets

# Manual-drop recipes (`manualDownload: true`) package whatever an operator has
# staged in SoftwareDropbox\<recipe id>. Vendors that gate their installer behind
# a signed-in, licensed download cannot be automated, so a human fetches the file
# once and drops it here. After a successful upload Yardstick moves the payload to
# SoftwareArchive\<recipe id>\<version>, which leaves the dropbox empty - that is
# what makes the next run skip the recipe instead of republishing the same build.
# Leave both blank if you have no manual-drop recipes.
SoftwareDropbox:
SoftwareArchive:
# Optional. When set, every .intunewin file Yardstick uploads is copied here on a
# background thread, into a subfolder named after the recipe id, under a file name
# carrying the version and the time Intune finished publishing it. Leave blank to
# disable backups. A network path is fine - the copy runs off the main thread, and a
# backup failure never fails an application update.
Backup:
# How many .intunewin files to retain per recipe in the Backup folder - the newest
# plus N-1 and N-2 by default. Set to 0 to keep every backup forever.
backupVersionsToKeep: 3
# Optional. With syncSharedContent: true, every run and every recipe harness
# script syncs both ways with a shared location before it starts:
#   Icons      New and changed icons are copied in both directions between
#              SharedIcons and the Icons folder; the newer copy wins. Nothing is
#              deleted on either side, and a file that is not a complete PNG or
#              JPEG image is never copied.
#   Overrides  Entries added or changed in Local\recipeOverrides.yaml are written
#              to the SharedRecipeOverrides file, and entries changed there are
#              brought into the local file. Deleting an entry locally does not
#              delete it from the share. When both sides changed the same entry,
#              the local copy wins on this computer and a warning names it.
# A share that cannot be reached, or a file that is malformed, is reported and
# skipped; the run carries on with what it last synced.
syncSharedContent: false
# SharedIcons: \\server\share\Intune\Icons
# SharedRecipeOverrides: \\server\share\Intune\Yardstick\recipeOverrides.yaml


#####################################
# INTUNE CONNECTION SETTINGS
#####################################
# Set to true on a computer that only develops and tests recipes with the recipe
# harness (Tests\RecipeHarness). It never signs in to Intune or Microsoft Graph and
# needs no app registration: Yardstick.ps1 refuses to run, and the shared icon and
# recipe override sync above still works.
developmentOnly: false
#
# TenantID, ClientId and ClientSecret are NOT stored here. They live in Windows
# Credential Manager, encrypted for the account that runs Yardstick. Populate them
# with .\Install-Yardstick.ps1 -Step AppRegistration (creates the app registration
# for you) or .\Set-YardstickCredential.ps1 (for an app you created yourself).
# If the legacy TenantID/ClientId/ClientSecret keys are still present below,
# Yardstick migrates them into Credential Manager on the next run and then asks you
# to delete them from this file.
#
# Credential Manager target name used to store the app registration credentials.
credentialTarget: "Yardstick:IntuneGraph"
# Warn (and email the admin) when the client secret expires within this many days.
credentialExpirationWarningDays: 30
# Minimum hours between repeat expiration emails, so frequent runs do not spam.
credentialExpirationEmailIntervalHours: 24
# Leave unset to follow emailNotificationEnabled; set explicitly to send (or not
# send) expiration alerts independently of the per-run application report.
credentialExpirationEmailEnabled:


#####################################
# PACKAGED APPLICATION DEFAULTS
#####################################
# Recipes can override most of these individually; see Docs\WritingRecipes.md.
defaultNumVersionsToKeep: 2
# Whether the newest uploaded version declares Intune-native supersedence over
# all kept older versions. Recipes can override with `supersedence`.
defaultSupersedence: true
# If true, supersedence uses "Replace" (Intune uninstalls the prior version
# before installing the new one). If false, uses "Update" (in-place upgrade).
# Recipes can override with `uninstallPreviousVersion`.
defaultUninstallPreviousVersion: false
# If true, Yardstick enables Intune's native auto-update
# (settings.autoUpdateSettings.autoUpdateSupersededAppsState = enabled) on the
# newest app's *available* assignments, so Intune pushes it to devices that
# already have a superseded version installed. Intune only honours auto-update
# for available assignments, so required-only recipes are unaffected. Recipes
# can override with `autoUpdateOnAssignment` (accepted alias: `autoUpdate`).
defaultAutoUpdate: true
# Entra group object IDs (GUIDs, device or user groups) that must never be
# auto-updated, even when auto-update is on for the app. Assignments targeting one
# of these groups are held at `notConfigured`, so adding a group here also turns off
# auto-update a previous run had already enabled. Recipes ADD to this list with
# `groupSkipAutoUpdates` - a recipe cannot remove a group listed here.
# Example: defaultGroupsSkipAutoUpdates: ["00000000-0000-0000-0000-000000000000"]
defaultGroupsSkipAutoUpdates: []
# Master switch for the DETECT anchor behavior. When enabled, the first time
# Yardstick updates a version-detection app under the new model, the oldest
# surviving version is renamed "Ω DETECT - <DisplayName>" and preserved so it
# continues to detect long-abandoned installs. The anchor is always a
# supersedence target of the newest version, always with type "Update".
useDetectAnchor: true
# Shown as the Owner field on every app Yardstick creates in Intune.
defaultOwner:
defaultMaximumInstallationTimeInMinutes: 60
# W10_1607, W10_1703, W10_1709, W10_1803, W10_1809, W10_1903, W10_1909, W10_2004,
# W10_20H2, W10_21H1, W10_21H2, W10_22H2, W11_21H2, W11_22H2, W11_23H2 or W11_24H2.
defaultMinOSVersion: W10_20H2
# system or user.
defaultInstallExperience: system
# basedOnReturnCode, allow, suppress or force.
defaultRestartBehavior: suppress
defaultAllowUserUninstall: true
defaultIs32BitApp: false
# none, x64, x86, arm64, x64x86 or AllWithARM64.
defaultArchitecture: none
defaultRequiresApproval: false
defaultDetectionScriptFileExtension: ps1
defaultDetectionScriptRunAs32Bit: false
defaultDetectionScriptEnforceSignatureCheck: false
# Whether apps that depend on a recipe's app are relinked to the new version.
defaultAllowDependentLinkUpdates: true
defaultDeadlineDateOffset: 0
defaultAvailableDateOffset: 0
# Intune scope tag names applied to every new app. Leave empty to use the built-in
# "Default" scope tag. Example: defaultScopeTags: ["Default", "Workstations"]
# To give a recipe its own scope tags, add it to Local\recipeOverrides.yaml rather
# than editing the recipe. See "Site-Specific Overrides" in Docs\WritingRecipes.md.
defaultScopeTags: []
# Entra group object IDs (GUIDs) that receive an Available assignment for every new
# version - typically an IT test group, so updates can be tried before they reach
# anyone else. Leave empty for no automatic assignment.
# Example: defaultDeploymentGroups: ["00000000-0000-0000-0000-000000000000"]
defaultDeploymentGroups: []


#####################################
# TIMEOUTS
#####################################
# Per-request timeout for downloads and web scraping. 0 disables the timeout.
webRequestTimeoutSeconds: 120
# A recipe that makes no progress for this long is abandoned so the rest of the run
# can continue. 0 disables the watchdog.
recipeStageTimeoutMinutes: 60
# Maximum time IntuneWinAppUtil may take to package one application.
packagingTimeoutMinutes: 30
# A BITS transfer that makes no progress for this long is cancelled.
bitsStallTimeoutMinutes: 15


#####################################
# EMAIL NOTIFICATION SETTINGS
#####################################
emailNotificationEnabled: false
# How email is delivered: "outlook" sends through the Outlook desktop client via
# COM; "smtp" sends straight to an SMTP server and needs no Outlook install. Use
# smtp for scheduled runs - Outlook needs a signed-in, interactive profile.
emailDeliveryMethod: outlook
emailRecipient:
# Two emails are sent per run. emailRecipient (the general list) receives only the
# software that was updated. adminEmailRecipient receives the full report -
# parameters, failures, dependents, auto-update and backup status - plus operational
# alerts such as client secret expiration. When blank, a single full report goes to
# emailRecipient and alerts fall back to it too.
adminEmailRecipient:
emailSubject: "Yardstick Application Update Report"
# Subject of the admin email. Defaults to emailSubject followed by " (Admin)".
# adminEmailSubject: "Yardstick Application Update Report (Admin)"
emailSenderName: "Yardstick Automation"
# Required for smtp delivery. With outlook it is optional and needs send-on-behalf rights.
emailSendFromAddress:
# Ask for confirmation before sending. Ignored when Yardstick runs with -NoInteractive.
emailPromptBeforeSending: false
# Optional .wav file played when the email is ready (interactive runs only).
# emailNotificationSoundFile: C:\Windows\Media\Windows Notify.wav
# SMTP settings, used only when emailDeliveryMethod is smtp.
smtpServer:
smtpPort: 25
smtpUseSsl: false
# Credential Manager target for the SMTP account. Leave the credential unset to
# relay anonymously; store one with:  .\Set-YardstickCredential.ps1 -Smtp
smtpCredentialTarget: "Yardstick:Smtp"


#####################################
# DEPENDENT LINK UPDATE SETTINGS
#####################################
dependentLinkUpdateEnabled: true
dependentLinkUpdateRetryCount: 3
dependentLinkUpdateRetryDelaySeconds: 5
dependentLinkUpdateTimeoutSeconds: 60
# Display names of dependent apps that must never be relinked to a new version.
# Example: dependentApplicationBlocklist: ["Legacy App That Pins An Old Runtime"]
dependentApplicationBlocklist: []
