# Supersedence and auto-update (all optional; inherit from preferences.yaml).
# `supersedence`: the newest uploaded version declares Intune-native
#   supersedence over every version Yardstick keeps, plus the {DETECT} anchor.
# `uninstallPreviousVersion`: true -> supersedence type "Replace" (Intune
#   uninstalls the prior version first); false -> "Update" (in-place upgrade).
# `autoUpdateOnAssignment`: enables Intune's native auto-update
#   (autoUpdateSupersededAppsState) so devices running a superseded version are
#   pulled forward. Intune only honours this on *available* assignments.
#supersedence: true
#uninstallPreviousVersion: false
#autoUpdateOnAssignment: true
