# Supersedence and auto-update (all optional; inherit from preferences.yaml).
# When `supersedence` is true, the newest uploaded version declares Intune-
# native supersedence over all kept older versions. When
# `uninstallPreviousVersion` is true the supersedence type is "Replace"
# (Intune uninstalls the prior version before installing the new one);
# otherwise it is "Update" (in-place upgrade). When
# `autoUpdateOnAssignment` is true, Intune pushes the new version to every
# device that already has a superseded version installed.
#supersedence: true
#uninstallPreviousVersion: false
#autoUpdateOnAssignment: true
