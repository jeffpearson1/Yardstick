url: https://github.com/wxMaxima-developers/wxmaxima
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/wxMaxima-developers/wxmaxima/releases/latest' -ErrorAction Stop
  if (-not $release) { throw 'Could not retrieve wxMaxima release information from GitHub.' }
  $asset = @($release.assets | Where-Object { $_.name -match '^wxMaxima-(?<ver>\d+(?:\.\d+)+)-win64\.exe$' -or $_.name -match '^wxmaxima-(?<ver>\d+(?:\.\d+)+)-Windows-x64\.exe$' })[0]
  if (-not $asset) { throw 'Could not find wxMaxima Windows x64 installer asset.' }
  if ($asset.name -notmatch '(?<ver>\d+(?:\.\d+)+)') { throw "Could not parse wxMaxima version from $($asset.name)." }
  $version = $matches['ver']
  $url = $asset.browser_download_url
  $fileName = $asset.name
installScript: '"<filename>" /S'
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'wxMaxima*' -and $_.UninstallString } |
    Sort-Object DisplayVersion -Descending |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the wxMaxima uninstaller registry entry.' }

  # UninstallString may carry arguments (e.g. '"...uninstall.exe" /AllUsers'),
  # so pull just the executable path out of it.
  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "wxMaxima uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe

  Start-Process -FilePath $exe -ArgumentList '/S', "_?=$installDir" -Wait

  # With _?= NSIS leaves the uninstaller folder, the ARP entry and the
  # Start Menu shortcuts behind, so clean those up explicitly.
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
  Remove-Item -LiteralPath $app.PSPath -Recurse -Force -ErrorAction SilentlyContinue
  Get-ChildItem -Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs') -Directory -ErrorAction SilentlyContinue |
    Where-Object { $_.Name -like 'wxMaxima*' } |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
iconFile: wxmaxima.png
id: wxmaxima
displayName: wxMaxima
publisher: wxMaxima developers
description: wxMaxima is a graphical user interface for the Maxima computer algebra system. The current Windows installer bundles wxMaxima runtime DLLs, but Maxima itself should be deployed separately.
fileType: exe
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      $found = $null
      if ($props.DisplayName -like 'wxMaxima*' -and [version]::TryParse([string]$props.DisplayVersion, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
maximumInstallationTimeInMinutes: 60
