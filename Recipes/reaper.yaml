url: https://www.reaper.fm/download.php
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $page = Invoke-WebRequest -Uri $url -UseBasicParsing -ErrorAction Stop
  $match = [regex]::Match($page.Content, 'href="(?<path>files/[^"/]+/reaper(?<build>\d+)_x64-install\.exe)"')
  if (-not $match.Success) { throw 'Could not find the REAPER x64 installer link.' }
  $relativePath = $match.Groups['path'].Value
  $build = $match.Groups['build'].Value
  $version = $build.Substring(0, 1) + '.' + $build.Substring(1)
  $fileName = Split-Path $relativePath -Leaf
  $url = 'https://www.reaper.fm/' + $relativePath
  $fileDetectionVersion = Format-FileDetectionVersion $version
powerShellInstallScript: |
  # REAPER's NSIS installer can return 1223 (ERROR_CANCELLED) even on a
  # successful silent install, so verify the result rather than trust the code.
  $process = Start-Process -FilePath ".\<filename>" -ArgumentList '/S' -Wait -PassThru
  $target = Join-Path ${env:ProgramFiles} 'REAPER (x64)\reaper.exe'
  if (-not (Test-Path -LiteralPath $target)) {
    throw "REAPER install failed (exit $($process.ExitCode)); '$target' was not created."
  }
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'REAPER*' -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the REAPER uninstaller registry entry.' }

  # UninstallString may carry arguments (e.g. '"...uninstall.exe" /AllUsers'),
  # so pull just the executable path out of it.
  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "REAPER uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe

  Start-Process -FilePath $exe -ArgumentList '/S', "_?=$installDir" -Wait

  # With _?= NSIS leaves the uninstaller folder, the ARP entry and the
  # Start Menu shortcuts behind, so clean those up explicitly.
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
  Remove-Item -LiteralPath $app.PSPath -Recurse -Force -ErrorAction SilentlyContinue
  Get-ChildItem -Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs') -Directory -ErrorAction SilentlyContinue |
    Where-Object { $_.Name -like 'REAPER*' } |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
iconFile: reaper.png
id: reaper
displayName: REAPER
publisher: Cockos Incorporated
description: REAPER is a complete digital audio production application for recording, editing, processing, mixing, and mastering audio and MIDI.
fileType: exe
detectionType: script
detectionScript: |
  # reaper.exe reports a 2-part file version ('7.79'), which never satisfies a
  # padded 4-part comparison, so detect via the ARP entry instead.
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notlike 'REAPER*') { continue }
      $found = $null
      if ([version]::TryParse([string]$props.DisplayVersion, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
