url: https://sourceforge.net/projects/scribus/best_release.json
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $release = Invoke-RestMethod -Uri $url -UseBasicParsing -ErrorAction Stop
  $windows = $release.platform_releases.windows
  if (-not $windows) { throw 'The Scribus SourceForge manifest reported no Windows release.' }
  if ($windows.filename -notmatch '^/scribus/(?<version>\d+(?:\.\d+)+)/(?<file>scribus-[^/]+-windows-x64\.exe)$') {
    throw "Unexpected Scribus Windows release path '$($windows.filename)'."
  }

  $version = $matches['version']
  $fileName = $matches['file']
  $url = 'https://sourceforge.net/projects/scribus/files' + $windows.filename + '/download'
  $registryDetectionValue = $version
installScript: <filename> /S
powerShellUninstallScript: |
  $entry = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'Scribus*' -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $entry) { throw 'Could not find the Scribus uninstaller registry entry.' }

  # UninstallString may carry arguments (e.g. '"...uninstall.exe" /AllUsers'),
  # so pull just the executable path out of it.
  $raw = [string]$entry.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "Scribus uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe

  # Scribus ships an NSIS installer; _?= forces a synchronous, in-place uninstall
  Start-Process -FilePath $exe -ArgumentList '/S', "_?=$installDir" -Wait

  # With _?= NSIS leaves the uninstaller folder, the ARP entry and the
  # Start Menu shortcuts behind, so clean those up explicitly.
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
  Remove-Item -LiteralPath $entry.PSPath -Recurse -Force -ErrorAction SilentlyContinue
  Get-ChildItem -Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs') -Directory -ErrorAction SilentlyContinue |
    Where-Object { $_.Name -like 'Scribus*' } |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
iconFile: scribus.png
id: scribus
displayName: Scribus
publisher: The Scribus Team
description: Scribus is a free and open-source desktop publishing and page layout application for creating print-ready documents.
fileType: exe
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notlike 'Scribus*') { continue }
      $text = ([string]$props.DisplayVersion) -replace '\s.*$', ''
      $found = $null
      if ([version]::TryParse($text, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
