url: https://wwwnaturalreaderscom.s3.amazonaws.com/software/naturalreader16.msi
urlRedirects: false
preDownloadScript: |
  # NaturalReader ships an evergreen MSI and publishes no version feed; the S3 bucket denies listing.
  # Stage the MSI once here, read its authoritative ProductVersion, and let downloadScript reuse it.
  $staged = Join-Path $env:TEMP 'Yardstick-naturalreader-naturalreader16.msi'
  Remove-Item -LiteralPath $staged -Force -ErrorAction SilentlyContinue
  Invoke-WebRequest -Uri $url -OutFile $staged -UseBasicParsing
  $installer = New-Object -ComObject WindowsInstaller.Installer
  $database = $installer.OpenDatabase($staged, 0)
  $view = $database.OpenView("SELECT Value FROM Property WHERE Property = 'ProductVersion'")
  $view.Execute()
  $record = $view.Fetch()
  $version = [string]$record.StringData(1)
  $view.Close()
  foreach ($comObject in @($record, $view, $database, $installer)) {
      if ($comObject) { [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($comObject) }
  }
  [GC]::Collect(); [GC]::WaitForPendingFinalizers()
  if (-not $version) { throw 'Could not read ProductVersion from the NaturalReader MSI.' }
  $fileName = 'naturalreader16.msi'
downloadScript: |
  Move-Item -LiteralPath (Join-Path $env:TEMP 'Yardstick-naturalreader-naturalreader16.msi') -Destination (Join-Path $PWD $fileName) -Force
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: naturalreader.png
id: naturalreader
displayName: NaturalReader 16
publisher: NaturalSoft Ltd.
description: NaturalReader converts text and documents into spoken audio using text-to-speech voices.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
