url: https://www.xnview.com/en/xnviewmp/#downloads
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $page = Invoke-WebRequest -Uri 'https://www.xnview.com/en/xnviewmp/' -UseBasicParsing -ErrorAction Stop
  $match = [regex]::Match($page.Content, 'XnView\s+MP\s+(?<ver>\d+(?:\.\d+)+)')
  if (-not $match.Success) { throw 'Could not find the XnView MP version on the product page.' }
  $version = $match.Groups['ver'].Value
  $url = 'https://download.xnview.com/XnViewMP-win-x64.exe'
  $fileName = 'XnViewMP-win-x64.exe'
installScript: <filename> /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { ($_.DisplayName -like 'XnView MP*' -or $_.DisplayName -like 'XnViewMP*') -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the XnView MP uninstaller registry entry.' }
  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "XnView MP uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe
  $process = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
  if ($process.ExitCode -ne 0) { throw "XnView MP uninstaller exited with $($process.ExitCode)." }
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
iconFile: xnviewmp.png
id: xnviewmp
displayName: XnView MP
publisher: XnSoft / Pierre-Emmanuel Gougelet
description: XnView MP is an image viewer, browser, and converter that is free for private or educational use but requires a paid license for commercial use.
fileType: exe
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notlike 'XnView MP*' -and $props.DisplayName -notlike 'XnViewMP*') { continue }
      $text = ([string]$props.DisplayVersion) -replace '\s.*$', ''
      $found = $null
      if ([version]::TryParse($text, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
