url: https://github.com/HandBrake/HandBrake
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/HandBrake/HandBrake/releases/latest' -Headers @{ 'User-Agent' = 'YardstickRecipe' } -ErrorAction Stop
  $version = $release.tag_name.TrimStart('v')
  $asset = $release.assets | Where-Object { $_.name -match '^HandBrake-[0-9.]+-x86_64-Win_GUI\.exe$' } | Select-Object -First 1
  if (-not $asset) { throw 'Could not find the HandBrake x86_64 Windows GUI installer.' }
  $url = $asset.browser_download_url
  $fileName = $asset.name
  $fileDetectionVersion = [VersionPro]::new($version).ToString(4)
installScript: <filename> /S
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'HandBrake*' -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the HandBrake uninstaller registry entry.' }

  # UninstallString may carry arguments (e.g. '"...uninstall.exe" /AllUsers'),
  # so pull just the executable path out of it.
  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "HandBrake uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe

  Start-Process -FilePath $exe -ArgumentList '/S', "_?=$installDir" -Wait

  # With _?= NSIS leaves the uninstaller folder, the ARP entry and the
  # Start Menu shortcuts behind, so clean those up explicitly.
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
  Remove-Item -LiteralPath $app.PSPath -Recurse -Force -ErrorAction SilentlyContinue
  Get-ChildItem -Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs') -Directory -ErrorAction SilentlyContinue |
    Where-Object { $_.Name -like 'HandBrake*' } |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
iconFile: handbrake.png
id: handbrake
displayName: HandBrake
publisher: HandBrake Team
description: HandBrake is an open-source video transcoder for converting video from nearly any format to modern codecs.
detectionType: file
fileDetectionPath: 'C:\Program Files\HandBrake'
fileDetectionName: HandBrake.exe
fileDetectionMethod: version
fileDetectionVersion:
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
