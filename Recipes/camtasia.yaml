url: https://download.techsmith.com/camtasiastudio/releases/camtasia.msi
urlRedirects: false
preDownloadScript: |
  $releaseNotesUrl = 'https://support.techsmith.com/hc/en-us/articles/41261973472269-Camtasia-Windows-2026-Version-History'
  $releaseNotes = Invoke-WebRequest -Uri $releaseNotesUrl -UseBasicParsing
  $releaseText = [Net.WebUtility]::HtmlDecode([string]$releaseNotes.Content)
  $versionMatch = [regex]::Match($releaseText, "What's New in (?:Version )?([0-9]+(?:\.[0-9]+){2})", 'IgnoreCase')
  if (-not $versionMatch.Success) {
    throw "Could not discover the current Camtasia Windows version from $releaseNotesUrl"
  }
  $version = $versionMatch.Groups[1].Value
fileName: camtasia.msi
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: camtasia.png
id: camtasia
displayName: Camtasia Editor
publisher: TechSmith Corporation
description: Camtasia Editor is a screen recording and video editing application for creating tutorials, demonstrations, and training content.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
