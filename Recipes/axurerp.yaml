url: https://www.axure.com/changelog
urlRedirects: false
version:
preDownloadScript: |
  $changelogUrl = $url
  $changelog = Invoke-WebRequest -Uri $changelogUrl -UseBasicParsing
  $installerMatch = [regex]::Match(
    [string]$changelog.Content,
    'href="(?<url>https://axure\.cachefly\.net/versions/[0-9.\-]+/AxureRP-Setup-[0-9]+\.exe)"[^>]*>.*?Axure RP (?<version>[0-9]+(?:\.[0-9]+){3}) for Windows',
    [Text.RegularExpressions.RegexOptions]::Singleline
  )
  if (-not $installerMatch.Success) {
    throw "Could not discover the current Axure RP Windows installer from $changelogUrl"
  }
  $url = $installerMatch.Groups['url'].Value
  $version = $installerMatch.Groups['version'].Value
  $fileName = [IO.Path]::GetFileName(([Uri]$url).AbsolutePath)
  $fileDetectionVersion = $version
installScript: <filename> /quiet /norestart
powerShellUninstallScript: |
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -ne 'Axure RP 11' -or $props.QuietUninstallString -notmatch 'Package Cache') { continue }
      $command = [Environment]::ExpandEnvironmentVariables([string]$props.QuietUninstallString)
      if ($command -match '^"(?<exe>[^"]+)"\s*(?<args>.*)$') {
        $process = Start-Process -FilePath $Matches.exe -ArgumentList $Matches.args, '/norestart' -Wait -PassThru
        exit $process.ExitCode
      }
    }
  }
  Write-Output 'Axure RP 11 is not installed.'
  exit 0
iconFile: axurerp.png
id: axurerp
displayName: Axure RP 11
publisher: Axure Software Solutions, Inc.
description: Axure RP is a prototyping and specification tool for interactive application and website designs.
detectionType: file
fileDetectionPath: '%ProgramFiles(x86)%\Axure\Axure RP 11'
fileDetectionName: AxureRP11.exe
fileDetectionMethod: version
fileDetectionVersion:
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
