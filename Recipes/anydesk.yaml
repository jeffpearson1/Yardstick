url: https://download.anydesk.com/changelog.txt
urlRedirects: false
preDownloadScript: |
  # Official AnyDesk changelog; the installer URL itself is evergreen and carries no version.
  $text = (Invoke-WebRequest -Uri $url -UseBasicParsing).Content
  if ($text -is [byte[]]) { $text = [System.Text.Encoding]::UTF8.GetString($text) }
  # The changelog interleaves platforms, so take the newest entry explicitly marked (Windows).
  $entry = [regex]::Match($text, '(?m)^\d{2}\.\d{2}\.\d{4} - (?<ver>\d+(?:\.\d+)+) \(Windows\)\s*$')
  if (-not $entry.Success) { throw 'No current AnyDesk Windows version was found in the official changelog.' }
  $version = $entry.Groups['ver'].Value
  $url = 'https://download.anydesk.com/AnyDesk.exe'
  $fileName = 'AnyDesk.exe'
  $fileDetectionVersion = $version
installScript: <filename> --install "C:\Program Files (x86)\AnyDesk" --silent --start-with-win --create-shortcuts
uninstallScript: '"%ProgramFiles(x86)%\AnyDesk\AnyDesk.exe" --remove --silent'
iconFile: anydesk.png
id: anydesk
displayName: AnyDesk
publisher: AnyDesk Software GmbH
description: AnyDesk provides remote desktop access, support, and unattended connectivity.
detectionType: file
fileDetectionPath: '%ProgramFiles(x86)%\AnyDesk'
fileDetectionName: AnyDesk.exe
fileDetectionMethod: version
fileDetectionVersion:
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
