url: https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64
urlRedirects: true
fileName: DiscordSetup.exe
preDownloadScript: |
  # urlRedirects: true means $url has already been resolved to the final
  # CDN location by the time this script runs (e.g.
  # https://stable.dl2.discordapp.net/distro/app/stable/win/x64/1.0.9251/DiscordSetup.exe),
  # confirmed live via a HEAD/302 check. The version is embedded in that path.
  if ($url -notmatch '/win/x64/(?<ver>[0-9.]+)/DiscordSetup\.exe$') {
    throw "Discord: could not parse version from redirected download URL '$url'."
  }
  $version = $matches['ver']
  $fileDetectionPath = "%LocalAppData%\Discord\app-$version"
  $fileDetectionVersion = Format-FileDetectionVersion $version
installScript: <filename> -s
uninstallScript: '"%LocalAppData%\Discord\Update.exe" --uninstall -s'
iconFile: discord.png
id: discord
displayName: Discord
publisher: Discord Inc.
description: Discord is a desktop communication client for text, voice, video, and community collaboration.
detectionType: file
fileDetectionName: Discord.exe
fileDetectionMethod: version
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: user
restartBehavior: suppress
minOSVersion: W11_24H2
