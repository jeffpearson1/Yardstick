url: https://inkscape.org/release/
urlRedirects: false
preDownloadScript: |
  # Official Inkscape current-release page redirects to the versioned release. Never pin a version here.
  $release = Invoke-WebRequest -Uri $url -UseBasicParsing
  $resolved = [string]$release.BaseResponse.RequestMessage.RequestUri.AbsoluteUri
  if ($resolved -notmatch '/release/inkscape-(?<ver>[0-9]+(?:\.[0-9]+)+)/') {
      throw "The Inkscape release page did not resolve to a versioned release: '$resolved'."
  }
  $version = $Matches['ver']
  # The per-release download page serves a meta-refresh to the real gallery asset.
  $downloadPage = (Invoke-WebRequest -Uri "https://inkscape.org/release/inkscape-$version/windows/64-bit/msi/dl/" -UseBasicParsing).Content
  if ($downloadPage -is [byte[]]) { $downloadPage = [System.Text.Encoding]::UTF8.GetString($downloadPage) }
  $asset = [regex]::Match($downloadPage, 'url=(?<path>/gallery/item/\d+/inkscape-[^"''\s]+\.msi)')
  if (-not $asset.Success) { throw "The Inkscape $version x64 signed MSI download page exposed no asset link." }
  $url = 'https://inkscape.org' + $asset.Groups['path'].Value
  $fileName = [IO.Path]::GetFileName(([Uri]$url).AbsolutePath)
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: inkscape.png
id: inkscape
displayName: Inkscape
publisher: Inkscape Project
description: Inkscape is a free and open-source vector graphics editor for SVG illustration and design.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
