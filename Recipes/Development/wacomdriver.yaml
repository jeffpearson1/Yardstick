url: https://www.wacom.com/en-us/support/product-support/drivers
urlRedirects: false
preDownloadScript: |
  $Content = Invoke-WebRequest -Uri $URL -UseBasicParsing
  $DriverMatch = [regex]::Match($Content.Content, 'https://cdn\.wacom\.com/u/productsupport/drivers/win/professional/WacomTablet_([0-9\.-]+)\.exe')
  $url = $DriverMatch.Value
  $filename = ($url -split "/")[-1]
  $version = $DriverMatch.Groups[1].Value
  $fileDetectionVersion = $version -replace '-', '.'
installScript: <filename> /S /ALLUSERS=1
uninstallScript: '"%ProgramFiles%\Tablet\Wacom\32\Remove.exe" /u /S'
iconFile: wacom.png
id: wacomdriver
displayName: DEV Wacom Tablet Drivers
publisher: Wacom
description: Driver for Wacom Tablets
detectionType: file
fileDetectionPath: '%ProgramFiles%\Tablet\Wacom'
fileDetectionName: Wacom_Tablet.exe
fileDetectionMethod: version
fileDetectionOperator: equal
installExperience: system
restartBehavior: suppress
minOSVersion: W11_24H2
numVersionsToKeep: 2