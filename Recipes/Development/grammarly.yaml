url: https://download-windows.grammarly.com/msi/GrammarlyInstaller-perUser-x64.msi
urlRedirects: false
preDownloadScript: |
  $fileName = 'GrammarlyInstaller-perUser-x64.msi'
  $stagedInstaller = Join-Path $Temp $fileName
  Start-BitsTransfer -Source $url -Destination $stagedInstaller
  $version = ([string](Get-MsiProperty -Path $stagedInstaller -PropertyName ProductVersion)).Trim()
downloadScript: |
  Copy-Item -LiteralPath (Join-Path $Temp $fileName) -Destination (Join-Path (Get-Location) $fileName) -Force
fileName: GrammarlyInstaller-perUser-x64.msi
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: grammarly.png
id: grammarly
displayName: Grammarly for Windows
publisher: Grammarly, Inc.
description: Grammarly for Windows provides writing suggestions across supported desktop applications and websites.
fileType: MSI
detectionType: msi
architecture: x64
installExperience: user
restartBehavior: suppress
minOSVersion: W10_20H2
