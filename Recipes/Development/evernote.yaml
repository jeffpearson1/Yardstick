url: https://win.desktop.evernote.com/builds/Evernote-latest.exe
urlRedirects: false
preDownloadScript: |
  $releaseNotes = Invoke-WebRequest -Uri 'https://evernote.com/release-notes' -UseBasicParsing
  if ([string]$releaseNotes.Content -notmatch 'Version\s+([0-9]+(?:\.[0-9]+){2})\s*-\s*Latest') {
    throw 'Unable to parse the current Evernote version from the official release notes.'
  }
  $version = $matches[1]
  $fileDetectionVersion = Format-FileDetectionVersion $version
fileName: Evernote-latest.exe
installScript: '"<filename>" /AllUsers /S'
powerShellUninstallScript: |
  $candidates = @(
    (Join-Path $env:ProgramFiles 'Evernote\Uninstall Evernote.exe')
    (Join-Path ${env:ProgramFiles(x86)} 'Evernote\Uninstall Evernote.exe')
  ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
  $uninstaller = $candidates | Select-Object -First 1
  if (-not $uninstaller) {
    Write-Output 'Evernote is not installed.'
    exit 0
  }
  $process = Start-Process -FilePath $uninstaller -ArgumentList '/AllUsers', '/S' -Wait -PassThru
  exit $process.ExitCode
uninstallScript: '%SystemRoot%\sysnative\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy bypass -File .\uninstall.ps1'
iconFile: evernote.png
id: evernote
displayName: Evernote
publisher: Bending Spoons US Inc.
description: Evernote is a note-taking and task-management application for capturing, organizing, and finding information across devices.
fileType: EXE
detectionType: file
fileDetectionPath: '%ProgramFiles%\Evernote'
fileDetectionName: Evernote.exe
fileDetectionMethod: version
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
