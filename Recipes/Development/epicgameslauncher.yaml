url: https://launcher-public-service-prod06.ol.epicgames.com/launcher/api/installer/download/EpicGamesLauncherInstaller.msi
urlRedirects: true
preDownloadScript: |
  # Epic's stable installer endpoint 303-redirects to the current versioned MSI, which Yardstick has
  # already resolved into $url by this point. Never pin a version here.
  if ($url -notmatch 'EpicInstaller-(?<ver>[0-9]+(?:\.[0-9]+)+)\.msi') {
      throw "The Epic Games Launcher installer endpoint did not resolve to a versioned MSI: '$url'."
  }
  $version = $Matches['ver']
  $fileName = "EpicInstaller-$version.msi"
postDownloadScript: |
  # Epic's release version (e.g. 20.1.4) and the MSI ProductVersion (e.g. 1.3.193.0) are different
  # schemes, and the MSI detection rule has to match the latter.
  $installer = New-Object -ComObject WindowsInstaller.Installer
  $database = $installer.OpenDatabase((Resolve-Path $fileName).Path, 0)
  $view = $database.OpenView("SELECT Value FROM Property WHERE Property = 'ProductVersion'")
  $view.Execute()
  $record = $view.Fetch()
  $fileDetectionVersion = [string]$record.StringData(1)
  $view.Close()
  foreach ($comObject in @($record, $view, $database, $installer)) {
      if ($comObject) { [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($comObject) }
  }
  [GC]::Collect(); [GC]::WaitForPendingFinalizers()
  if (-not $fileDetectionVersion) { throw 'Could not read ProductVersion from the Epic Games Launcher MSI.' }
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: epicgameslauncher.png
id: epicgameslauncher
displayName: Epic Games Launcher
publisher: Epic Games, Inc.
description: Epic Games Launcher installs and manages Epic Games Store titles and Unreal Engine tools.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
