url: https://download.slicer.org/find?os=win&stability=release
urlRedirects: false
preDownloadScript: |
  # Official Slicer release-locator API. Never pin a version or bitstream here.
  $meta = Invoke-RestMethod -Uri 'https://download.slicer.org/find?os=win&stability=release' -UseBasicParsing
  if ($meta.os -ne 'win' -or $meta.arch -ne 'amd64' -or $meta.stability -ne 'release') {
      throw "The Slicer locator returned an unexpected build (os=$($meta.os) arch=$($meta.arch) stability=$($meta.stability))."
  }
  $version = [string]$meta.version
  if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "Unexpected Slicer version string '$version'." }
  if ([string]::IsNullOrWhiteSpace([string]$meta.download_url)) { throw 'The Slicer locator returned no download URL.' }
  $url = 'https://download.slicer.org' + [string]$meta.download_url
  $fileName = "Slicer-$version-win-amd64.exe"
  # CPack installs Slicer into a version-scoped program directory.
  $fileDetectionPath = "%ProgramFiles%\Slicer $version"
installScript: <filename> /S
uninstallScript: '"%ProgramFiles%\Slicer <version>\Uninstall.exe" /S'
iconFile: slicer.png
id: slicer
displayName: 3D Slicer
publisher: 3D Slicer contributors
description: 3D Slicer is an open-source platform for medical image visualization, processing, and analysis.
detectionType: file
fileDetectionPath:
fileDetectionName: Slicer.exe
fileDetectionMethod: exists
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
