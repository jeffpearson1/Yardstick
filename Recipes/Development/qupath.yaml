url: https://github.com/qupath/qupath
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'QuPath-v[0-9.]+-Windows\.msi$', '[0-9]+\.[0-9]+\.[0-9]+')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
  if (-not $url -or -not $fileName) { throw 'No stable QuPath Windows MSI was found.' }
  $fileDetectionVersion = Format-FileDetectionVersion $version
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: qupath.png
id: qupath
displayName: QuPath
publisher: QuPath developers
description: QuPath is open-source software for bioimage analysis and digital pathology research.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
