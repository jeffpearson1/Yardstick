url: https://store.wiris.com/en/products/mathtype/download/windows
urlRedirects: false
preDownloadScript: |
  # Official WIRIS MathType Windows download page. Never pin a version here.
  $html = (Invoke-WebRequest -Uri $url -UseBasicParsing).Content
  if ($html -is [byte[]]) { $html = [System.Text.Encoding]::UTF8.GetString($html) }
  if ($html -notmatch 'data-content="(?<url>https://downloads\.wiris\.com/mathtype/windows/MathType-win-en-(?<ver>[0-9]+(?:\.[0-9]+)+)\.exe)"') {
      throw 'No English Windows MathType installer was found on the official download page.'
  }
  $version = $Matches['ver']
  $url = $Matches['url']
  $fileName = [IO.Path]::GetFileName(([Uri]$url).AbsolutePath)
  # MathType.exe carries an unrelated version scheme (2026.7.1.466 for release 7.12.2.466),
  # so detection reads the installer's own ARP entry instead. That DisplayVersion is the
  # three-part form of the published version.
  $registryDetectionValue = ($version -split '\.')[0..2] -join '.'
installScript: <filename> /S
powerShellUninstallScript: |
  # WIRIS documents the silent uninstall as "Setup.exe -Q -R" in the MathType 7 Network
  # Administrator's Manual. -Q is the InstallScript quiet flag; the NSIS-style /S and the
  # lowercase -s used elsewhere are ignored by Setup.exe and leave dialogs on screen.
  # https://docs.wiris.com/en_US/technical-documentation-nmathtype-7/network-administrators-manual
  $setup = Join-Path ${env:ProgramFiles(x86)} 'MathType\Setup.exe'
  $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\DSMT7'

  if (Test-Path -LiteralPath $setup) {
      Start-Process -FilePath $setup -ArgumentList '-Q', '-R' -Wait -ErrorAction SilentlyContinue
  }

  # MathType never removes user customisations, and InstallScript can leave the program
  # directory behind, so clear both so a reinstall starts from a known state.
  Remove-Item -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'MathType') -Recurse -Force -ErrorAction SilentlyContinue
  Remove-Item -LiteralPath $key -Recurse -Force -ErrorAction SilentlyContinue
  exit 0
iconFile: mathtype.png
id: mathtype
displayName: MathType
publisher: WIRIS
description: MathType is an equation editor for creating mathematical notation in documents, presentations, and web content.
detectionType: registry
registryDetectionMethod: version
registryDetectionKey: 'HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\DSMT7'
registryDetectionValueName: DisplayVersion
registryDetectionValue:
registryDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2

