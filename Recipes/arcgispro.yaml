# ArcGIS Pro is distributed through the licensed My Esri/ArcGIS organization
# download surface. Stage the complete extracted media (ArcGISPro.msi and every
# adjacent CAB) in <SoftwareDropbox>\arcgispro. The recipe discovers the MSI even
# when the media is wrapped in an ArcGISPro subdirectory.
manualDownload: true
manualDownloadFolder: arcgispro
preDownloadScript: |
  if (-not (Get-Variable -Name dropboxPath -ErrorAction SilentlyContinue)) { $dropboxPath = '<SoftwareDropbox>\arcgispro' }
  if (-not (Get-Variable -Name dropboxFiles -ErrorAction SilentlyContinue)) { $dropboxFiles = @() }

  $installer = Get-ChildItem -LiteralPath $dropboxPath -Filter 'ArcGISPro.msi' -File -Recurse -ErrorAction SilentlyContinue |
    Select-Object -First 1
  if (-not $installer) {
    throw "No ArcGISPro.msi was found in $dropboxPath. Stage the complete extracted ArcGIS Pro media, including all CAB files."
  }

  $dropboxRoot = $dropboxPath.TrimEnd('\')
  $fileName = $installer.FullName.Substring($dropboxRoot.Length).TrimStart('\')
  $url = $installer.FullName

  $setupIni = Join-Path $installer.Directory.FullName 'setup.ini'
  $version = $null
  if (Test-Path -LiteralPath $setupIni) {
    $versionLine = Get-Content -LiteralPath $setupIni | Where-Object { $_ -match '^ProductVersion=' } | Select-Object -First 1
    if ($versionLine -match '^ProductVersion=(\d+(?:\.\d+){1,3})\s*$') { $version = $Matches[1] }
  }
  if (-not $version) {
    $version = @(Get-MsiProperty -Path $installer.FullName -PropertyName ProductVersion) |
      Where-Object { [string]$_ -match '^\d+(?:\.\d+){1,3}$' } |
      Select-Object -Last 1
  }
  if ([string]$version -notmatch '^\d+(?:\.\d+){1,3}$') {
    throw "Could not read a valid ArcGIS Pro ProductVersion from '$($installer.FullName)'."
  }
fileType: msi
installScript: 'msiexec /i "<filename>" /qn /norestart ALLUSERS=1 ACCEPTEULA=YES AUTHORIZATION_TYPE=NAMED_USER ARCGIS_CONNECTION=TRUE LICENSE_URL="https://<your_org>.maps.arcgis.com" PORTAL_LIST="https://<your_org>.maps.arcgis.com"'
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: arcgispro.png
id: arcgispro
displayName: ArcGIS Pro
publisher: Environmental Systems Research Institute, Inc.
description: ArcGIS Pro is Esri's professional desktop GIS for mapping, spatial analysis, data management, and geovisualization. This <YOUR_ORG> package configures Named User licensing and the <YOUR_ORG> ArcGIS portal.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W11_24H2
maximumInstallationTimeInMinutes: 180
uninstallPreviousVersion: false
