url: https://www.audacityteam.org/download/windows/
urlRedirects: false
preDownloadScript: |
  $Content = Invoke-WebRequest $URL
  $url = ($Content.links | where href -match "audacity-win-.*-x86_64\.msi").href
  $filename = ($url -split "/")[-1]
  $filename -match "([0-9]{1,}\.){2}[0-9]{1,}" | Out-Null
  $version = $matches[0]
installScript: msiexec /i <filename> /qn /norestart ALLUSERS=1
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: audacity.png
id: audacity
displayName: Audacity
publisher: The Audacity Team
description: Audacity is a free, open source, cross-platform audio software for multi-track recording and editing.
fileType: msi
detectionType: msi
installExperience: system
restartBehavior: suppress
minOSVersion: W11_24H2
uninstallPreviousVersion: true
numVersionsToKeep: 2