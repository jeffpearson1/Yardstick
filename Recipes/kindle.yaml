url: https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/a/Amazon/Kindle
urlRedirects: false
preDownloadScript: |
  # Amazon publishes no version feed for Kindle for PC: www.amazon.com/kindlepcdownload rejects
  # automated requests and the S3 bucket denies listing. Microsoft's winget-pkgs repository is the
  # only machine-readable source. It is community-maintained (unofficial) and may lag the vendor,
  # but the installer it points at is still Amazon's own S3 bucket.
  $entries = Invoke-RestMethod -Uri $url -Headers @{ 'User-Agent' = 'Yardstick' }
  $version = ($entries |
      Where-Object { $_.type -eq 'dir' -and $_.name -match '^[0-9]+(\.[0-9]+)+$' } |
      Sort-Object { [version]$_.name } -Descending |
      Select-Object -First 1).name
  if (-not $version) { throw 'No Kindle for PC version was found in the winget-pkgs manifest index.' }
  $manifest = Invoke-RestMethod -Uri "https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/a/Amazon/Kindle/$version/Amazon.Kindle.installer.yaml" -Headers @{ 'User-Agent' = 'Yardstick' }
  if ($manifest -is [byte[]]) { $manifest = [System.Text.Encoding]::UTF8.GetString($manifest) }
  $installer = [regex]::Match($manifest, 'InstallerUrl:\s*(?<url>\S+)')
  if (-not $installer.Success) { throw "The winget-pkgs manifest for Kindle for PC $version listed no installer." }
  $url = $installer.Groups['url'].Value
  $fileName = [Uri]::UnescapeDataString([IO.Path]::GetFileName(([Uri]$url).AbsolutePath))
  $fileDetectionVersion = Format-FileDetectionVersion $version
installScript: <filename> /S
uninstallScript: '"%ProgramFiles(x86)%\Amazon\Kindle\uninstall.exe" /S'
iconFile: kindle.png
id: kindle
displayName: Kindle for PC
publisher: Amazon.com Services LLC
description: Kindle for PC reads and manages Kindle ebooks on Windows.
detectionType: file
fileDetectionPath: '%ProgramFiles(x86)%\Amazon\Kindle'
fileDetectionName: Kindle.exe
fileDetectionMethod: version
fileDetectionVersion:
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
