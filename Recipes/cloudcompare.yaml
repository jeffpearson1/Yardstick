url: https://www.cloudcompare.org/release/index.html
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $page = Invoke-WebRequest -Uri 'https://www.cloudcompare.org/release/index.html' -UseBasicParsing -ErrorAction Stop
  $matches = [regex]::Matches($page.Content, 'href="(?<name>CloudCompare_v(?<ver>\d+(?:\.\d+)+)_setup_x64\.exe)"')
  $candidates = foreach ($match in $matches) {
    [PSCustomObject]@{ Name = $match.Groups['name'].Value; Version = [version]$match.Groups['ver'].Value }
  }
  $candidate = $candidates | Sort-Object Version -Descending | Select-Object -First 1
  if (-not $candidate) { throw 'Could not find a stable CloudCompare x64 installer on the release page.' }
  $version = $candidate.Version.ToString()
  $fileName = $candidate.Name
  $url = [uri]::new([uri]'https://www.cloudcompare.org/release/', $fileName).AbsoluteUri
installScript: <filename> /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'CloudCompare*' -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the CloudCompare uninstaller registry entry.' }
  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "CloudCompare uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe
  $process = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
  if ($process.ExitCode -ne 0) { throw "CloudCompare uninstaller exited with $($process.ExitCode)." }
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
iconFile: cloudcompare.png
id: cloudcompare
displayName: CloudCompare
publisher: CloudCompare project / Daniel Girardeau-Montaut
description: CloudCompare is open-source 3D point-cloud and mesh processing software for visualization, registration, segmentation, and analysis.
fileType: exe
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notlike 'CloudCompare*') { continue }
      $text = ([string]$props.DisplayVersion) -replace '\s.*$', ''
      $found = $null
      if ([version]::TryParse($text, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
