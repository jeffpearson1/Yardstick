url: https://github.com/UB-Mannheim/tesseract/releases
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  # Prefer the UB-Mannheim GitHub release assets over digi.bib.uni-mannheim.de. The
  # university host intermittently returns HTTP 403 to automated clients (it did so during
  # an install-test run), whereas the GitHub release serves the identical installer.
  $releases = Invoke-RestMethod -Uri 'https://api.github.com/repos/UB-Mannheim/tesseract/releases?per_page=30' `
    -Headers @{ 'User-Agent' = 'YardstickRecipe' } -ErrorAction Stop

  $candidates = foreach ($release in ($releases | Where-Object { -not $_.draft })) {
    foreach ($asset in $release.assets) {
      if ($asset.name -notmatch '^tesseract-ocr-w64-setup-(?<ver>[0-9][^"/]*?)\.exe$') { continue }
      $rawVersion = $Matches['ver']
      if ($rawVersion -match '(?i)alpha|beta|rc') { continue }
      $parsed = $null
      if ([version]::TryParse($rawVersion, [ref]$parsed)) {
        [PSCustomObject]@{ Name = $asset.name; Url = $asset.browser_download_url; Version = $parsed; VersionText = $rawVersion }
      }
    }
  }

  $candidate = $candidates | Sort-Object Version -Descending | Select-Object -First 1
  if (-not $candidate) { throw 'Could not find a stable UB Mannheim Tesseract w64 installer in the GitHub releases.' }
  $version = $candidate.VersionText
  $fileName = $candidate.Name
  $url = $candidate.Url
# The NSIS installer's silent /S mode installs the default selected components; no stable documented
# command-line switches for selecting additional language-pack components were found in the release sources.
installScript: <filename> /S
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { ($_.DisplayName -like 'Tesseract-OCR*' -or $_.DisplayName -like '*Tesseract*') -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the Tesseract-OCR uninstaller registry entry.' }
  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "Tesseract-OCR uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe
  Start-Process -FilePath $exe -ArgumentList '/S', "_?=$installDir" -Wait
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
  Remove-Item -LiteralPath $app.PSPath -Recurse -Force -ErrorAction SilentlyContinue
  Get-ChildItem -Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs') -Directory -ErrorAction SilentlyContinue |
    Where-Object { $_.Name -like '*Tesseract*' } |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
iconFile: tesseract.png
id: tesseract
displayName: Tesseract OCR
publisher: UB Mannheim / Tesseract OCR contributors
description: Tesseract OCR is an open-source optical character recognition engine packaged for Windows by UB Mannheim.
fileType: exe
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notlike 'Tesseract-OCR*' -and $props.DisplayName -notlike '*Tesseract*') { continue }
      $text = ([string]$props.DisplayVersion) -replace '\s.*$', ''
      $found = $null
      if ([version]::TryParse($text, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
