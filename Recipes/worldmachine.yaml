# World Machine downloads are gated behind an account login, so this uses the project's
# manualDownload pattern: stage the official Windows installer in <SoftwareDropbox>\worldmachine.
# World Machine ships an NSIS installer, so /S is the silent switch.
manualDownload: true
manualDownloadFolder: worldmachine
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  if (-not (Get-Variable -Name dropboxPath -ErrorAction SilentlyContinue)) { $dropboxPath = '<SoftwareDropbox>\worldmachine' }
  if (-not (Get-Variable -Name dropboxFiles -ErrorAction SilentlyContinue)) { $dropboxFiles = @() }

  $installer = $dropboxFiles |
    Where-Object { $_.Extension -ieq '.exe' } |
    Sort-Object LastWriteTime -Descending |
    Select-Object -First 1
  if (-not $installer) {
    throw "No World Machine installer staged in $dropboxPath. Download manually from https://www.world-machine.com/download.php (account login required) and place the .exe there."
  }

  $fileName = $installer.Name
  $url = $installer.FullName

  # Prefer an explicit version.txt, then the filename, then the binary's version resource.
  $versionFile = Join-Path $dropboxPath 'version.txt'
  if (Test-Path -LiteralPath $versionFile) {
    $candidate = (Get-Content -LiteralPath $versionFile -Raw).Trim()
    if ($candidate -match '\d+(?:\.\d+){1,3}') { $version = $Matches[0] }
  }
  if (-not $version -and $fileName -match '(\d+(?:\.\d+){1,3})') { $version = $Matches[1] }
  if (-not $version) {
    $raw = [string](Get-Item -LiteralPath $installer.FullName).VersionInfo.ProductVersion
    if ($raw -and $raw.Trim() -match '\d+(?:\.\d+){1,3}') { $version = $Matches[0] }
  }
  if (-not $version) { throw "Could not determine a World Machine version for '$fileName'. Add a version.txt next to the installer." }
fileType: exe
powerShellInstallScript: |
  $installer = (Resolve-Path -LiteralPath '.\<filename>').ProviderPath
  $installDir = Join-Path $env:ProgramFiles 'World Machine'

  # NSIS: /S is silent and /D (which must be last, unquoted) sets the install directory.
  $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
  if ($process.ExitCode -ne 0) { throw "World Machine installer exited with $($process.ExitCode)." }
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'World Machine*' -and ($_.QuietUninstallString -or $_.UninstallString) } |
    Select-Object -First 1

  if (-not $app) { exit 0 }

  $raw = [string]$app.UninstallString
  if ([string]::IsNullOrWhiteSpace($raw)) { $raw = [string]$app.QuietUninstallString }
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "World Machine uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe

  # "_?=<dir>" forces the NSIS uninstaller to run synchronously and in place.
  $process = Start-Process -FilePath $exe -ArgumentList '/S', "_?=$installDir" -Wait -PassThru
  if ($process.ExitCode -ne 0) { throw "World Machine uninstaller exited with $($process.ExitCode)." }

  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
  Remove-Item -LiteralPath $app.PSPath -Recurse -Force -ErrorAction SilentlyContinue
iconFile: worldmachine.png
id: worldmachine
displayName: World Machine
publisher: World Machine Software
description: World Machine is professional terrain generation, erosion simulation, and heightfield editing software used in game development and visual effects.
detectionType: script
detectionScript: |
  $expectedText = '<version>'
  $expectedParts = @($expectedText -split '\.')

  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notlike 'World Machine*') { continue }

      $foundText = ([string]$props.DisplayVersion) -replace '\s.*$', ''
      $foundParts = @($foundText -split '\.')
      if ($foundParts.Count -lt 2) {
        Write-Output 'Detected'
        exit 0
      }

      $count = [Math]::Min([Math]::Min($expectedParts.Count, $foundParts.Count), 4)
      $expected = $null
      $found = $null
      if ([version]::TryParse((($expectedParts[0..($count - 1)]) -join '.'), [ref]$expected) -and
          [version]::TryParse((($foundParts[0..($count - 1)]) -join '.'), [ref]$found) -and
          $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
