url: https://endnote.com/downloads/available-updates/
urlRedirects: false
preDownloadScript: |
  # endnote.com sits behind a bot filter that intermittently 403s scripted
  # requests, so find the current release by probing download.endnote.com,
  # which only hosts the current release year's installer.
  $releaseYear = $null
  $currentYear = (Get-Date).Year
  foreach ($candidateYear in ($currentYear + 1)..($currentYear - 3)) {
    $candidateUrl = "https://download.endnote.com/downloads/$candidateYear/EN$($candidateYear)Inst.msi"
    try {
      Invoke-WebRequest -Uri $candidateUrl -Method Head -UseBasicParsing | Out-Null
      $releaseYear = $candidateYear
      break
    } catch {
      continue
    }
  }

  if (-not $releaseYear) {
    throw "Could not find an EndNote base MSI on download.endnote.com for $($currentYear - 3)-$($currentYear + 1)"
  }

  $downloadRoot = "https://download.endnote.com/downloads/$releaseYear"
  $fileName = "EN$($releaseYear)Inst.msi"
  $url = "$downloadRoot/$fileName"
  $updateFileName = "EN$($releaseYear)Update.msp"
  $updateUrl = "$downloadRoot/$updateFileName"
  $updateAvailable = $false
  # The MSI is 32-bit, so EndNote always lands under Program Files (x86).
  $fileDetectionPath = "C:\Program Files (x86)\EndNote $releaseYear"

  $tempDir = Join-Path $Temp $id
  if (-not (Test-Path $tempDir)) {
    New-Item -Path $tempDir -ItemType Directory -Force | Out-Null
  }

  # EndNote's marketing year (2025) differs from its file version (22.x), so read
  # the real version from the MSI rather than deriving it from the year.
  $msiTempPath = Join-Path $tempDir $fileName
  Start-BitsTransfer -Source $url -Destination $msiTempPath
  $version = ([string](Get-MsiProperty -Path $msiTempPath -PropertyName ProductVersion)).Trim()
  if (-not $version) {
    throw "Could not read ProductVersion from $url"
  }

  # Clarivate usually re-rolls the base MSI to include the latest update, in which
  # case the MSP no longer applies (msiexec 1642). Only ship the MSP when it moves
  # the base MSI to a newer build.
  try {
    Invoke-WebRequest -Uri $updateUrl -Method Head -UseBasicParsing | Out-Null
    $updateTempPath = Join-Path $tempDir $updateFileName
    Start-BitsTransfer -Source $updateUrl -Destination $updateTempPath

    $windowsInstaller = New-Object -ComObject WindowsInstaller.Installer
    $patchInfo = $windowsInstaller.GetType().InvokeMember('SummaryInformation', 'GetProperty', $null, $windowsInstaller, @($updateTempPath, 0))
    # PID_COMMENTS (6) holds "Version: <target build>" for EndNote patches.
    $patchComments = [string]$patchInfo.GetType().InvokeMember('Property', 'GetProperty', $null, $patchInfo, 6)
    if ($patchComments -match '(\d+\.\d+\.\d+\.\d+)' -and [version]$Matches[1] -gt [version]$version) {
      $updateAvailable = $true
      $version = $Matches[1]
    }
  } catch {
    $updateAvailable = $false
  }

  $fileDetectionVersion = $version
downloadScript: |
  Move-Item -Path $msiTempPath -Destination $fileName -Force

  if ($updateAvailable) {
    Move-Item -Path $updateTempPath -Destination $updateFileName -Force
  }
powerShellInstallScript: |
  function Invoke-EndNoteMsiexec {
    param (
      [Parameter(Mandatory = $true)]
      [string]$Arguments
    )

    $process = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $Arguments -Wait -PassThru
    if ($process.ExitCode -notin @(0, 3010)) {
      exit $process.ExitCode
    }
  }

  Invoke-EndNoteMsiexec -Arguments "/i `"$PSScriptRoot\<filename>`" /qn /norestart"

  Get-ChildItem -Path $PSScriptRoot -Filter "*.msp" |
    Sort-Object Name |
    ForEach-Object {
      Invoke-EndNoteMsiexec -Arguments "/p `"$($_.FullName)`" /qn /norestart"
    }
installScript: |
  %SystemRoot%\sysnative\WindowsPowerShell\v1.0\powershell.exe -noprofile -executionpolicy bypass -file .\install.ps1
powerShellUninstallScript: |
  $process = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList '/x <productcode> /qn /norestart' -Wait -PassThru
  if ($process.ExitCode -notin @(0, 1605, 3010)) {
    exit $process.ExitCode
  }

  # The MSI installs the ResearchSoft Direct Export Helper as a separate product
  # (risweb32 /S) and does not remove it on uninstall.
  $helperKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\ResearchSoft Direct Export Helper'
  $helperUninstaller = Join-Path ${env:ProgramFiles(x86)} 'Common Files\Risxtd\uninstall.exe'
  if (Test-Path -LiteralPath $helperUninstaller) {
    Start-Process -FilePath $helperUninstaller -ArgumentList '/S' -Wait
    # The NSIS uninstaller hands off to a temp copy and returns early.
    for ($i = 0; $i -lt 30 -and (Test-Path -LiteralPath $helperKey); $i++) {
      Start-Sleep -Seconds 2
    }
  }

  # msiexec leaves empty Backup\* folders behind; remove the install folder only
  # when no files remain in it.
  Get-ChildItem -Path ${env:ProgramFiles(x86)} -Directory -Filter 'EndNote *' -ErrorAction SilentlyContinue |
    Where-Object { -not (Get-ChildItem -LiteralPath $_.FullName -File -Recurse -Force -ErrorAction SilentlyContinue) } |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

  # 1605 (product not installed) still counts as uninstalled.
  if ($process.ExitCode -eq 1605) { exit 0 }
  exit $process.ExitCode
iconFile: endnote.png
id: endnote
displayName: EndNote
publisher: Clarivate
description: EndNote is a reference management application used to collect, organize, cite, and share research references.
softwareName: "EndNote*"
fileType: msi
detectionType: file
fileDetectionName: EndNote.exe
fileDetectionMethod: version
fileDetectionOperator: greaterThanOrEqual
scopeTags:
  - scopeTag1
  - scopeTag2
