url: https://e3.boxcdn.net/box-installers/boxedit/win/currentrelease/BoxToolsInstaller-AdminInstall.msi
urlRedirects: false
preDownloadScript: |
  # Box publishes only an evergreen "currentrelease" machine-wide MSI and no version feed; the CDN
  # prefix denies directory listing and returns no version header. Stage the MSI once here, read its
  # authoritative ProductVersion, and let downloadScript reuse the same file.
  $staged = Join-Path $env:TEMP 'Yardstick-boxtools-BoxToolsInstaller-AdminInstall.msi'
  Remove-Item -LiteralPath $staged -Force -ErrorAction SilentlyContinue
  Invoke-WebRequest -Uri $url -OutFile $staged -UseBasicParsing
  $installer = New-Object -ComObject WindowsInstaller.Installer
  $database = $installer.OpenDatabase($staged, 0)
  $view = $database.OpenView("SELECT Value FROM Property WHERE Property = 'ProductVersion'")
  $view.Execute()
  $record = $view.Fetch()
  $version = [string]$record.StringData(1)
  $view.Close()
  foreach ($comObject in @($record, $view, $database, $installer)) {
      if ($comObject) { [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($comObject) }
  }
  [GC]::Collect(); [GC]::WaitForPendingFinalizers()
  if ($version -notmatch '^[0-9]+(\.[0-9]+){1,3}$') { throw "Could not read a valid ProductVersion from the Box Tools admin MSI (got '$version')." }
  $fileName = 'BoxToolsInstaller-AdminInstall.msi'
downloadScript: |
  Move-Item -LiteralPath (Join-Path $env:TEMP 'Yardstick-boxtools-BoxToolsInstaller-AdminInstall.msi') -Destination (Join-Path $PWD $fileName) -Force
installScript: msiexec /i <filename> /qn /norestart
powerShellUninstallScript: |
  # The MSI uninstall removes every component it installed, but Box Edit and the Box Local Com Server
  # write daily log files into their own program directories at runtime, so those folders survive.
  $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList '/x', '<productcode>', '/qn', '/norestart' -Wait -PassThru
  $exitCode = $process.ExitCode

  foreach ($leftover in @('C:\Program Files\Box\Box Edit', 'C:\Program Files\Box\Box Local Com Server')) {
      Remove-Item -LiteralPath $leftover -Recurse -Force -ErrorAction SilentlyContinue
  }

  # Box Drive installs under the same parent, so only remove it once nothing else is left there.
  $root = 'C:\Program Files\Box'
  if ((Test-Path -LiteralPath $root) -and -not (Get-ChildItem -LiteralPath $root -Force)) {
      Remove-Item -LiteralPath $root -Force -ErrorAction SilentlyContinue
  }

  exit $exitCode
iconFile: boxtools.png
id: boxtools
displayName: Box Tools
publisher: Box, Inc.
description: Box Tools lets people open and edit Box files in their desktop applications and supports Box Device Trust.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
