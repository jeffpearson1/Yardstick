url: \\yoursiteserver.yourcompany.com\sms_<your_org>\Client
urlRedirects: false
preDownloadScript: |
  $PathToCCMSetupEXE = "$url\ccmsetup.exe"
  $Version = (Get-Item $PathToCCMSetupEXE).VersionInfo.ProductVersion
downloadScript: |
  Copy-Item "$url\*" . -Recurse -Force
installScript: ccmsetup.exe /noservice /mp:https://YOURMP.URL CCMHOSTNAME="YOURMP.URL" /BITSPriority:HIGH SMSCACHESIZE=20000 SMSSITECODE="<YOUR_ORG>"
uninstallScript: ccmsetup.exe /uninstall
fileName: ccmsetup.exe
iconFile: sccm.png
id: sccmclient
displayName: SCCM Client
publisher: Microsoft
description: Allows management by SCCM
fileType: exe
detectionType: script
detectionScript: |
  If (Get-Service -Name "CCMExec"){
    Write-Host "Installed"
  }
numVersionsToKeep: 1
autoUpdate: false
minOSVersion: W10_1709
