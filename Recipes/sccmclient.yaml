url: \\<YOUR_SITE_SERVER>\SMS_<YOUR_SITE_CODE>\Client
urlRedirects: false
preDownloadScript: |
  $PathToCCMSetupEXE = "$url\ccmsetup.exe"
  $Version = (Get-Item $PathToCCMSetupEXE).VersionInfo.ProductVersion
downloadScript: |
  Copy-Item "$url\*" . -Recurse -Force
installScript: ccmsetup.exe /noservice /mp:https://<YOUR_MANAGEMENT_POINT> CCMHOSTNAME="<YOUR_MANAGEMENT_POINT>" /BITSPriority:HIGH SMSCACHESIZE=20000 SMSSITECODE="<YOUR_SITE_CODE>"
uninstallScript: ccmsetup.exe /uninstall
fileName: ccmsetup.exe
iconFile: sccm.png
id: sccmclient
displayName: SCCM Client
publisher: Microsoft
description: Allows management by SCCM
fileType: exe
detectionType: script
detectionScript: |
  If (Get-Service -Name "CCMExec"){
    Write-Host "Installed"
  }
numVersionsToKeep: 1
autoUpdate: false
minOSVersion: W10_1709
