url: https://updates.signal.org/desktop/latest.yml
urlRedirects: false
preDownloadScript: |
  # Official Signal Desktop release manifest. Never pin a version here.
  # The manifest is served without a charset, so PowerShell 7 hands back raw bytes; coerce to text.
  $feed = Invoke-RestMethod -Uri 'https://updates.signal.org/desktop/latest.yml' -UseBasicParsing
  if ($feed -is [byte[]]) { $feed = [System.Text.Encoding]::UTF8.GetString($feed) }
  if ($feed -notmatch '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$') { throw 'No Signal Desktop version was found in the official manifest.' }
  $version = $Matches[1]
  $asset = "signal-desktop-win-x64-$version.exe"
  if ($feed -notmatch [regex]::Escape("url: $asset")) { throw "The official manifest does not list the Windows x64 asset '$asset'." }
  $url = "https://updates.signal.org/desktop/$asset"
  $fileName = $asset
  $fileDetectionVersion = $version
installScript: <filename> /S
uninstallScript: '"%LocalAppData%\Programs\signal-desktop\Uninstall Signal.exe" /S'
iconFile: signaldesktop.png
id: signaldesktop
displayName: Signal Desktop
publisher: Signal Messenger, LLC
description: Signal Desktop is the Windows client for the Signal end-to-end encrypted messaging service.
detectionType: file
fileDetectionPath: '%LocalAppData%\Programs\signal-desktop'
fileDetectionName: Signal.exe
fileDetectionMethod: version
fileDetectionVersion:
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: user
restartBehavior: suppress
minOSVersion: W10_20H2
