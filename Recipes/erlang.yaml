url: https://github.com/erlang/otp/releases
urlRedirects: false
preDownloadScript: |
  # erlang.org/downloads links to the erlang/otp GitHub releases. Maintenance releases of older
  # branches are published after newer majors, so pick the highest version, not the newest release.
  $otpReleases = Invoke-YardstickGitHubApi 'repos/erlang/otp/releases?per_page=30'
  $otpCandidates = foreach ($otpRelease in ($otpReleases | Where-Object { -not $_.draft -and -not $_.prerelease })) {
    if ($otpRelease.tag_name -notmatch '^OTP-(?<ver>\d+(\.\d+){1,3})$') { continue }
    $otpAsset = @($otpRelease.assets | Where-Object { $_.name -eq "otp_win64_$($Matches['ver']).exe" })
    if ($otpAsset.Count -ne 1) { continue }
    [PSCustomObject]@{ Version = [version]$Matches['ver']; VersionText = $Matches['ver']; Name = $otpAsset[0].name; Url = $otpAsset[0].browser_download_url }
  }
  $otpBest = $otpCandidates | Sort-Object Version -Descending | Select-Object -First 1
  if (-not $otpBest) { throw 'Could not find a stable Erlang/OTP win64 installer in the erlang/otp GitHub releases.' }
  $version = $otpBest.VersionText
  $fileName = $otpBest.Name
  $url = $otpBest.Url
# The OTP installer is NSIS (erts/etc/win32/nsis/erlang20.nsi in erlang/otp): /S is silent and it
# installs to %ProgramFiles%\Erlang OTP. It writes the ARP key HKLM\...\Uninstall\Erlang OTP with
# DisplayVersion equal to the OTP version. The uninstaller does RMDir /r on its own directory.
installScript: <filename> /S
powerShellUninstallScript: |
  # The installer is a 32-bit NSIS build, so its ARP key can land under WOW6432Node; some builds also
  # omit it. Check both views, then fall back to the Uninstall.exe the installer always writes.
  $exe = $null
  foreach ($arpPath in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Erlang OTP', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Erlang OTP') {
    $arp = Get-ItemProperty -Path $arpPath -ErrorAction SilentlyContinue
    if (-not $arp -or -not $arp.UninstallString) { continue }
    $raw = [string]$arp.UninstallString
    $candidate = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
      elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
      else { $raw.Trim('"') }
    if (Test-Path -LiteralPath $candidate) { $exe = $candidate; break }
  }
  if (-not $exe) {
    $candidate = Join-Path $env:ProgramFiles 'Erlang OTP\Uninstall.exe'
    if (Test-Path -LiteralPath $candidate) { $exe = $candidate }
  }
  if (-not $exe) { return }
  $installDir = Split-Path -Parent $exe
  # _?= keeps the NSIS uninstaller in place so -Wait covers the whole uninstall.
  $process = Start-Process -FilePath $exe -ArgumentList '/S', "_?=$installDir" -Wait -PassThru
  if ($process.ExitCode -ne 0) { throw "Erlang OTP uninstaller exited with $($process.ExitCode)." }
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
iconFile: erlang.png
id: erlang
displayName: Erlang
publisher: Erlang Ecosystem Foundation
description: Erlang/OTP is a programming language and runtime system for building scalable, fault-tolerant, soft real-time systems.
fileType: exe
detectionType: script
detectionScript: |
  if (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'Erlang OTP\bin\erl.exe')) {
    Write-Output 'Detected'
    exit 0
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
