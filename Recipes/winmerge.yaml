url: https://github.com/WinMerge/winmerge/releases
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/WinMerge/winmerge/releases/latest' -Headers @{ 'User-Agent' = 'YardstickRecipe' } -ErrorAction Stop
  $asset = $release.assets |
    Where-Object { $_.name -match '^WinMerge-[0-9]+(?:\.[0-9]+)+-x64-Setup\.exe$' -and $_.name -notmatch 'PerUser' } |
    Select-Object -First 1
  if (-not $asset) { throw 'Could not find the machine-wide WinMerge x64 Setup installer asset.' }
  $match = [regex]::Match($asset.name, '^WinMerge-(?<version>[0-9]+(?:\.[0-9]+)+)-x64-Setup\.exe$')
  if (-not $match.Success) { throw "Could not parse WinMerge version from '$($asset.name)'." }
  $version = $match.Groups['version'].Value
  $url = $asset.browser_download_url
  $fileName = $asset.name
# Machine-wide x64 Setup EXE selected explicitly; PerUser and portable ZIP assets are excluded. Inno Setup confirmed by .itext+.bss section evidence.
installScript: <filename> /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'WinMerge*' -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the WinMerge uninstaller registry entry.' }

  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "WinMerge uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe

  $process = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
  if ($process.ExitCode -ne 0) { throw "WinMerge uninstaller exited with $($process.ExitCode)." }

  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
iconFile: winmerge.png
id: winmerge
displayName: WinMerge
publisher: WinMerge Project
description: WinMerge is a free and open-source differencing and merging tool for files and folders on Windows.
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notlike 'WinMerge*') { continue }
      $text = ([string]$props.DisplayVersion) -replace '\s.*$', ''
      $found = $null
      if ([version]::TryParse($text, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
