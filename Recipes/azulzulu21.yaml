# Azul Zulu Community JDK 21 LTS, Windows x64. The MSI marks both "Add to PATH" (FeatureEnvironment) and "JavaSoft
# (Oracle) registry keys" (FeatureOracleJavaSoft) as Level 1, so a bare msiexec /i would modify the system PATH and
# HKLM\SOFTWARE\JavaSoft. ADDLOCAL=ZuluInstallation installs only the JDK core to C:\Program Files\Zulu\zulu-21 and
# leaves PATH, JAVA_HOME and the JavaSoft keys unchanged (docs.azul.com/core/install/windows). The core feature still
# registers HKCR .jar -> Zulu.jarfile; there is no separate feature to suppress that.
# Source: Azul Metadata API v1 (docs.azul.com/core/install/metadata-api). arch=x64 is the documented 64-bit selector
# (hw_bitness is a response field, not a filter). latest=true returns one package per release line (for example
# 21.54.201 / jdk 21.0.13.1 and 21.50.19 / jdk 21.0.11), so the script sorts by distro_version and takes the highest.
# distro_version is four integers; for Zulu 11+ the fourth is padding and the MSI ProductVersion is the first three.
# Reject a nonzero fourth part rather than silently treating a distinct distribution as the same version.
# Every 21.x MSI shares UpgradeCode {E427EEB9-94E6-4F77-9456-69C7046BFF7D} and major-upgrades older 21.x builds; the
# ProductCode changes per release, so msi detection/uninstall use the extracted <productcode>.
url: 'https://api.azul.com/metadata/v1/zulu/packages/?java_version=21&os=windows&arch=x64&java_package_type=jdk&javafx_bundled=false&archive_type=msi&release_status=ga&availability_types=CA&latest=true'
preDownloadScript: |
  $packages = @(Invoke-RestMethod -Uri $url -ErrorAction Stop | ForEach-Object { $_ })
  $package = $packages | Where-Object { $_.name -match '^zulu[\d.]+-ca-jdk21[\d.]*-win_x64\.msi$' -and $_.distro_version.Count -eq 4 } | Sort-Object { [version]($_.distro_version -join '.') } -Descending | Select-Object -First 1
  if (-not $package -or -not $package.download_url) { throw 'Azul Metadata API returned no matching Zulu 21 Windows x64 JDK MSI.' }
  if ($package.distro_version[3] -ne 0) { throw 'Azul returned a nonzero fourth distribution version component; review the MSI version scheme.' }
  $version = ($package.distro_version | Select-Object -First 3) -join '.'
  $fileName = $package.name
  $url = $package.download_url
downloadScript: |
  # cdn.azul.com (Cloudflare) sends Last-Modified as a Unix epoch number, not an HTTP date.
  # BITS rejects that in normal mode ("job is not making progress"); -Dynamic works.
  Invoke-YardstickBitsDownload -Source $url -Destination (Join-Path (Get-Location).Path $fileName) -Dynamic
installScript: msiexec /i <filename> ADDLOCAL=ZuluInstallation /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: azulzulu21.png
id: azulzulu21
displayName: Azul Zulu JDK 21 (x64)
publisher: Azul Systems, Inc.
description: Azul Zulu Community build of OpenJDK 21 for 64-bit Windows.
fileType: msi
detectionType: msi
installExperience: system
restartBehavior: suppress
architecture: x64
minOSVersion: W10_20H2

