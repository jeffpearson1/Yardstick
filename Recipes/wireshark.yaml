url:
urlRedirects: false
preDownloadScript: |
  $URL = "https://www.wireshark.org/download.html"
  $Content = Invoke-WebRequest $URL
  # Any number of digits per part (4.6.10 broke the old one-digit pattern). The
  # anchor and the three numeric parts leave out release candidates, ARM64 and
  # the portable build. Newest stable wins.
  $installers = foreach ($link in $Content.links) {
    if ($link.href -match 'Wireshark-(\d+\.\d+\.\d+)-x64\.exe$') {
      [pscustomobject]@{ Href = $link.href; Version = [version]$Matches[1] }
    }
  }
  $latest = @($installers | Sort-Object Version -Descending) | Select-Object -First 1
  if (-not $latest) { throw "No Wireshark x64 installer link on $URL." }
  $url = $latest.Href
  $filename = $url.split("/")[-1]
  $version = $latest.Version.ToString()
  $fileDetectionVersion = "$version.0"
installScript: <filename> /S
uninstallScript: '"C:\Program Files\Wireshark\uninstall-wireshark.exe" /S'
iconFile: wireshark.png
id: wireshark
displayName: Wireshark
publisher: Wireshark Foundation
description: Wireshark is a free and open-source packet analyzer. It is used for network troubleshooting, analysis, software and communications protocol development, and education. 
detectionType: file
fileDetectionPath: '%ProgramFiles%\Wireshark'
fileDetectionName: Wireshark.exe
fileDetectionMethod: version
fileDetectionOperator: equal
