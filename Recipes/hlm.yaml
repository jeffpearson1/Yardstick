# HLM is licence-gated: Scientific Software International only publishes the installer inside the
# authenticated SSI Live customer portal (https://ssilive.com/customer/info), so there is no URL
# Yardstick can fetch. Stage the vendor-supplied HLMInstaller.exe in <SoftwareDropbox>\hlm.
#
# Engine (verified against HLMInstaller.exe 2026-09-01): a WiX Burn bundle. The binary contains a
# .wixburn section plus WixBundle / MsiPackage / ExePackage markers, and its argument table
# includes the standard Burn verbs /quiet /passive /norestart /uninstall /repair /layout /log.
# Install is therefore `/quiet /norestart` and uninstall is `/uninstall /quiet /norestart`.
# Burn also writes a QuietUninstallString to ARP, which the uninstall script prefers.
manualDownload: true
manualDownloadFolder: hlm
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  if (-not (Get-Variable -Name dropboxPath -ErrorAction SilentlyContinue)) { $dropboxPath = '<SoftwareDropbox>\hlm' }
  if (-not (Get-Variable -Name dropboxFiles -ErrorAction SilentlyContinue)) { $dropboxFiles = @() }

  $installer = $dropboxFiles |
    Where-Object { $_.Extension -eq '.exe' } |
    Sort-Object LastWriteTime -Descending |
    Select-Object -First 1
  if (-not $installer) {
    throw "No HLM installer (.exe) staged in $dropboxPath. Download HLM from the SSI Live customer portal (https://ssilive.com/customer/info) and place HLMInstaller.exe there."
  }

  $fileName = $installer.Name
  $url = $installer.FullName

  # Version discovery, most trustworthy source first. SSI ships the bootstrapper with a
  # placeholder file version of 1.0.0.0, so the file's own version resource is useless.
  $version = $null

  # 1. An explicit version.txt dropped alongside the installer wins.
  $versionFile = $dropboxFiles | Where-Object { $_.Name -ieq 'version.txt' } | Select-Object -First 1
  if ($versionFile) {
    $candidate = (Get-Content -LiteralPath $versionFile.FullName -Raw).Trim()
    if ($candidate -match '^\d+(?:\.\d+){1,3}$') { $version = $candidate }
  }

  # 2. A version baked into the file name, e.g. HLMInstaller-8.2.exe.
  if (-not $version -and $fileName -match '(\d+(?:\.\d+){1,3})') { $version = $Matches[1] }

  # 3. Fall back to the most frequently occurring "HLM <major>.<minor>" string inside the
  #    bootstrapper. The product name is repeated throughout the embedded MSI's UI tables, so the
  #    modal value is reliable where a simple max would pick up incidental digit runs.
  if (-not $version) {
    $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
    $text = [System.Text.Encoding]::Unicode.GetString($bytes) + "`n" + [System.Text.Encoding]::ASCII.GetString($bytes)
    $version = [regex]::Matches($text, 'HLM\s(\d+\.\d+)') |
      ForEach-Object { $_.Groups[1].Value } |
      Group-Object |
      Sort-Object Count, Name -Descending |
      Select-Object -First 1 -ExpandProperty Name
  }

  if (-not $version) { throw "Could not determine the HLM version for $fileName. Drop a version.txt next to the installer." }
fileType: exe
installScript: <filename> /quiet /norestart
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -match '^HLM(\s|$)' -and ($_.QuietUninstallString -or $_.UninstallString) } |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the HLM uninstall entry in the registry.' }

  $command = if ($app.QuietUninstallString) { [string]$app.QuietUninstallString } else { [string]$app.UninstallString }

  if ($command -match '\{[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\}') {
    # The bundle registered an MSI product code.
    $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList '/x', $Matches[0], '/qn', '/norestart' -Wait -PassThru
  } else {
    # WiX Burn bundle cache: "<cached bundle>.exe" /uninstall /quiet /norestart
    $raw = $command
    $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
      elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
      else { $raw.Trim('"') }
    if (-not (Test-Path -LiteralPath $exe)) { throw "HLM uninstaller not found at '$exe'." }
    $process = Start-Process -FilePath $exe -ArgumentList '/uninstall', '/quiet', '/norestart' -Wait -PassThru
  }

  if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
    throw "HLM uninstaller exited with $($process.ExitCode)."
  }
iconFile: hlm.png
id: hlm
displayName: HLM
publisher: Scientific Software International, Inc.
description: HLM (Hierarchical Linear and Nonlinear Modeling) is a statistical package for fitting multilevel and hierarchical linear models. A licence purchased from Scientific Software International is required, and the installer must be staged manually because SSI distributes it only through its authenticated customer portal.
detectionType: script
detectionScript: |
  # SSI reports the ARP DisplayVersion with more components than the marketing version
  # (for example 8.2.3.1410 against 8.2), so compare only the components both sides publish.
  $expectedText = '<version>'
  $expectedParts = @($expectedText -split '\.')

  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notmatch '^HLM(\s|$)') { continue }

      $foundText = ([string]$props.DisplayVersion) -replace '\s.*$', ''
      $foundParts = @($foundText -split '\.')
      if ($foundParts.Count -lt 2) {
        Write-Output 'Detected'
        exit 0
      }

      $count = [Math]::Min([Math]::Min($expectedParts.Count, $foundParts.Count), 4)
      $expected = $null
      $found = $null
      if ([version]::TryParse((($expectedParts[0..($count - 1)]) -join '.'), [ref]$expected) -and
          [version]::TryParse((($foundParts[0..($count - 1)]) -join '.'), [ref]$found) -and
          $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
maximumInstallationTimeInMinutes: 60
