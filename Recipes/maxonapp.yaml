url: https://packages.maxon.net/manifests?platform=windows&org=maxon&type=products&family=fuse
urlRedirects: false
preDownloadScript: |
  # Official Maxon package manifest service. Never pin a version here.
  $manifests = Invoke-RestMethod -Uri $url
  $latest = $manifests |
      Where-Object { $_.name -eq 'maxon.products.fuse.mxa-combo-installer' -and $_.releaseType -eq 'full' } |
      Sort-Object { [version]$_.version } -Descending |
      Select-Object -First 1
  if (-not $latest) { throw 'No Maxon App combo installer was found in the official manifest service.' }
  $version = [string]$latest.version
  if ($version -notmatch '^[0-9]+(\.[0-9]+)+$') { throw "Unexpected Maxon App version string '$version'." }
  $fileName = "Maxon_App_${version}_Win.exe"
  $url = "https://mx-app-blob-prod.maxon.net/mx-package-production/website/windows/maxon/maxonapp/releases/$version/$fileName"
  $fileDetectionVersion = Format-FileDetectionVersion $version
installScript: <filename> --mode unattended --unattendedmodeui none --elevated 1 --do_not_execute_maxonapp 1
powerShellUninstallScript: |
  # Maxon App registers no ARP entry and ships no uninstaller executable. The vendor's supported
  # removal path is Tools\uninstall-appmanager.bat, which deletes Maxon.exe and the data folders
  # but leaves its own empty program directories behind, so clear those afterwards.
  $ErrorActionPreference = 'SilentlyContinue'

  # Maxon App installs a "Maxon Install Helper" service plus a MxNotify tray process, and the
  # vendor batch removes neither. They keep their binaries locked, which leaves the program
  # directory behind and makes a later reinstall fail with exit 1.
  foreach ($serviceName in 'Maxon Install Helper') {
      $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
      if ($service) {
          Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
          & sc.exe delete "$serviceName" | Out-Null
      }
  }

  foreach ($name in 'Maxon', 'MaxonApp', 'SerialFiller', 'MxNotify', 'InstallHelper') {
      foreach ($proc in @(Get-Process -Name $name -ErrorAction SilentlyContinue)) {
          try { $proc.Kill(); $proc.WaitForExit(15000) } catch { }
      }
  }

  $batch = Join-Path $env:ProgramFiles 'Maxon\Tools\uninstall-appmanager.bat'
  if (Test-Path -LiteralPath $batch) {
      Start-Process -FilePath $env:ComSpec -ArgumentList '/c', "`"$batch`"" -Wait -WindowStyle Hidden -ErrorAction SilentlyContinue
  }

  foreach ($path in @(
          (Join-Path $env:ProgramFiles 'Maxon')
          (Join-Path $env:ProgramData 'Maxon')
          (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\Maxon App')
          (Join-Path $env:LOCALAPPDATA 'Maxon'))) {
      Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
  }

  # The ARP entry is registered under a version-stamped key name ("Maxon App v2026.5.0") and the
  # vendor batch never removes it, so match on DisplayName instead of guessing the key.
  foreach ($root in 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall') {
      Get-ChildItem -Path $root -ErrorAction SilentlyContinue |
          Where-Object { (Get-ItemProperty -Path $_.PSPath -ErrorAction SilentlyContinue).DisplayName -like 'Maxon App*' } |
          ForEach-Object { Remove-Item -LiteralPath $_.PSPath -Recurse -Force -ErrorAction SilentlyContinue }
  }

  exit 0
iconFile: maxonapp.png
id: maxonapp
displayName: Maxon App
publisher: Maxon Computer GmbH
description: Maxon App installs, licenses, and manages Maxon creative applications and plugins included with Maxon One.
detectionType: file
fileDetectionPath: '%ProgramFiles%\Maxon\App Manager'
fileDetectionName: Maxon.exe
fileDetectionMethod: version
fileDetectionVersion:
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2

