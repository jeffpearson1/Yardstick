url: https://support-en.wd.com/app/answers/detailweb/a_id/29494/
urlRedirects: false
preDownloadScript: |
  $notes = (Invoke-WebRequest -Uri $url -UseBasicParsing -ErrorAction Stop).Content
  $windows = $notes.IndexOf('Windows Releases', [StringComparison]::OrdinalIgnoreCase)
  if ($windows -lt 0) { throw "Could not find the Windows release section in '$url'." }
  $match = [regex]::Match($notes.Substring($windows), 'Version[:\s]+(?<version>\d+(?:\.\d+){2,3})', 'IgnoreCase')
  if (-not $match.Success) { throw "Could not resolve the latest WD Drive Utilities Windows version from '$url'." }
  $version = $match.Groups['version'].Value
  $url = 'https://downloads.wdc.com/wdapp/WDDriveUtilities_WIN.zip'
  $fileName = 'WDDriveUtilities_WIN.zip'
fileType: zip
powerShellInstallScript: |
  $extract = Join-Path $PWD '_wddriveutilities'
  Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
  Expand-Archive -LiteralPath '.\<filename>' -DestinationPath $extract -Force
  $setup = Get-ChildItem -LiteralPath $extract -Filter 'WDDriveUtilitiesSetup.exe' -Recurse -File | Select-Object -First 1
  if (-not $setup) { throw 'WDDriveUtilities_WIN.zip did not contain WDDriveUtilitiesSetup.exe.' }
  $process = Start-Process -FilePath $setup.FullName -ArgumentList '/quiet', '/norestart' -Wait -PassThru
  if ($process.ExitCode -notin 0, 3010) { throw "WD Drive Utilities installer exited with $($process.ExitCode)." }
  Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
powerShellUninstallScript: |
  $extract = Join-Path $PWD '_wddriveutilities_uninstall'
  Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
  Expand-Archive -LiteralPath '.\<filename>' -DestinationPath $extract -Force
  $setup = Get-ChildItem -LiteralPath $extract -Filter 'WDDriveUtilitiesSetup.exe' -Recurse -File | Select-Object -First 1
  if (-not $setup) { throw 'WDDriveUtilities_WIN.zip did not contain WDDriveUtilitiesSetup.exe.' }
  $process = Start-Process -FilePath $setup.FullName -ArgumentList '/uninstall', '/quiet', '/norestart' -Wait -PassThru
  if ($process.ExitCode -notin 0, 3010) { throw "WD Drive Utilities uninstaller exited with $($process.ExitCode)." }
  Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
iconFile: wddriveutilities.png
id: wddriveutilities
displayName: WD Drive Utilities
publisher: Western Digital Technologies, Inc.
description: WD Drive Utilities provides diagnostics, sleep-timer, RAID, erase, and registration tools for supported Western Digital drives.
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'WD Drive Utilities*' } |
    Select-Object -First 1
  $found = $null
  if ($app -and [version]::TryParse(([string]$app.DisplayVersion -replace '[^0-9.].*$',''), [ref]$found) -and $found -ge $expected) {
    Write-Output 'Detected'
    exit 0
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
