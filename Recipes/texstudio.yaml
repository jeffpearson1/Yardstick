url: https://github.com/texstudio-org/texstudio
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'texstudio-.*-win-qt6-signed\.exe$', '[0-9]+\.[0-9]+\.[0-9]+')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
installScript: <filename> /S
uninstallScript: '"%ProgramFiles%\texstudio\uninstall.exe" /S'
iconFile: texstudio.png
id: texstudio
displayName: TeXstudio
publisher: TeXstudio
description: TeXstudio is an open-source LaTeX editor with integrated writing, building, viewing, and bibliography tools.
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      $found = $null
      if ($props.DisplayName -like 'TeXstudio*' -and [version]::TryParse([string]$props.DisplayVersion, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
