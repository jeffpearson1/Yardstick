url: https://e3.boxcdn.net/desktop/releases/win/BoxDrive.msi
urlRedirects: false
preDownloadScript: |
  # Box publishes an evergreen Box Drive MSI and no version feed; the CDN prefix denies directory
  # listing and the download carries no version header. Stage the MSI once here, read its
  # authoritative ProductVersion, and let downloadScript reuse the same 131 MB file.
  $staged = Join-Path $env:TEMP 'Yardstick-boxdrive-BoxDrive.msi'
  Remove-Item -LiteralPath $staged -Force -ErrorAction SilentlyContinue
  Invoke-WebRequest -Uri $url -OutFile $staged -UseBasicParsing
  $installer = New-Object -ComObject WindowsInstaller.Installer
  $database = $installer.OpenDatabase($staged, 0)
  $view = $database.OpenView("SELECT Value FROM Property WHERE Property = 'ProductVersion'")
  $view.Execute()
  $record = $view.Fetch()
  $version = [string]$record.StringData(1)
  $view.Close()
  foreach ($comObject in @($record, $view, $database, $installer)) {
      if ($comObject) { [void][System.Runtime.InteropServices.Marshal]::ReleaseComObject($comObject) }
  }
  [GC]::Collect(); [GC]::WaitForPendingFinalizers()
  if ($version -notmatch '^[0-9]+(\.[0-9]+){1,3}$') { throw "Could not read a valid ProductVersion from the Box Drive MSI (got '$version')." }
  $fileName = 'BoxDrive.msi'
downloadScript: |
  Move-Item -LiteralPath (Join-Path $env:TEMP 'Yardstick-boxdrive-BoxDrive.msi') -Destination (Join-Path $PWD $fileName) -Force
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: boxdrive.png
id: boxdrive
displayName: Box Drive
publisher: Box, Inc.
description: Box Drive maps Box cloud storage to a local drive so people can browse and edit Box content from File Explorer.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_22H2
maximumInstallationTimeInMinutes: 60
