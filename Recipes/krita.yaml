url: https://download.kde.org/stable/krita/
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $index = Invoke-WebRequest -Uri $url -UseBasicParsing -ErrorAction Stop
  $versions = [regex]::Matches($index.Content, 'href="(?<version>\d+(?:\.\d+)+)/"') |
    ForEach-Object { [version]$_.Groups['version'].Value } |
    Sort-Object -Descending
  if (-not $versions) { throw 'Could not find Krita stable release folders.' }

  foreach ($candidate in $versions) {
    $candidateVersion = $candidate.ToString()
    $releaseUrl = "https://download.kde.org/stable/krita/$candidateVersion/"
    $release = Invoke-WebRequest -Uri $releaseUrl -UseBasicParsing -ErrorAction SilentlyContinue
    $asset = [regex]::Matches($release.Content, 'href="(?<file>krita-x64-[^"/]+-setup\.exe)"') |
      ForEach-Object { $_.Groups['file'].Value } |
      Select-Object -Unique -First 1
    if ($asset) {
      $version = $candidateVersion
      $fileName = $asset
      $url = $releaseUrl + $fileName
      $fileDetectionVersion = Format-FileDetectionVersion $version
      break
    }
  }

  if (-not $fileName) { throw 'Could not find a Krita x64 setup executable.' }
installScript: <filename> /S
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'Krita*' -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the Krita uninstaller registry entry.' }

  # UninstallString may carry arguments (e.g. '"...uninstall.exe" /AllUsers'),
  # so pull just the executable path out of it.
  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "Krita uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe

  Start-Process -FilePath $exe -ArgumentList '/S', "_?=$installDir" -Wait

  # With _?= NSIS leaves the uninstaller folder, the ARP entry and the
  # Start Menu shortcuts behind, so clean those up explicitly.
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
  Remove-Item -LiteralPath $app.PSPath -Recurse -Force -ErrorAction SilentlyContinue
  Get-ChildItem -Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs') -Directory -ErrorAction SilentlyContinue |
    Where-Object { $_.Name -like 'Krita*' } |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
iconFile: krita.png
id: krita
displayName: Krita
publisher: Krita Foundation
description: Krita is a free and open-source painting and illustration application for digital artists.
fileType: exe
detectionType: script
detectionScript: |
  # krita.exe reports a version like '6.0.3 (git 858d352)', which is not a
  # parseable version, so detect via the ARP entry instead.
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notlike 'Krita*') { continue }
      $text = ([string]$props.DisplayVersion) -replace '\s.*$', ''
      $found = $null
      if ([version]::TryParse($text, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
