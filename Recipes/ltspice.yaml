url: https://ltspice.analog.com/software/LTspice64.msi
urlRedirects: false
preDownloadScript: |
  $downloadPage = "https://www.analog.com/en/resources/design-tools-and-calculators/ltspice-simulator.html"
  $driver = Start-SeDriver -Browser "Firefox" -StartURL $downloadPage -Arguments @('--headless', '--width=1920', '--height=1080')
  Start-Sleep -Seconds 10 # Wait for page to load
  $version = ((Get-SeElement -By xpath "//a[@href='https://ltspice.analog.com/software/LTspice64.msi']/../../span[contains(text(), 'Version')]").Text -split "\ ")[1]
  if ($driver) {
      $driver.close()
  }
  if ($version -notmatch "([0-9]+\.[0-9]+\.[0-9]+)") {
    throw "Unable to parse LTspice version number from Analog Devices download page."
  }
downloadScript: |
  # Download the MSI
  $filename = "LTspice64.msi"
  Start-BitsTransfer -Source $Script:URL -Destination "$TEMP\$filename" -Dynamic
  # Extract the cab files 
  Start-Process -FilePath "msiexec.exe" -ArgumentList "/a `"$TEMP\$filename`" /qn TARGETDIR=$TEMP\LTspice_Extracted" -Wait
  # Move the extracted files to the staging area
  Move-Item -Path "$TEMP\LTspice_Extracted\*" -Destination "$BUILDSPACE\$id\$version" -Force
powerShellInstallScript: |  
  # Set Varables
  $systemProfileLocalPath = Join-Path -Path $env:windir -ChildPath "SysWOW64\config\systemprofile\AppData\Local"
  $systemProfileLtSpicePath = Join-Path -Path $systemProfileLocalPath -ChildPath "LTspice"

  # Seed the System Profile
  Copy-Item -Path "$PSScriptRoot\LocalAppDataFolder\LTspice" -Destination "$systemProfileLocalPath" -Recurse -Force

  # Install LTSpice
  Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$PSScriptRoot\LTSpice64.msi`" ALLUSERS=1 AI_INSTALLPERUSER=3 /qn /norestart" -Wait
   
  # Cleanup
  if (Test-Path -Path $systemProfileLtSpicePath){
      Remove-Item -Path $systemProfileLtSpicePath -Recurse -Force
  }
installScript: '%SystemRoot%\sysnative\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy bypass -File .\install.ps1'
uninstallScript: msiexec /x <productcode> /qn /norestart
fileName: LTspice64.msi
iconFile: ltspice.png
id: LTSpice
displayName: LTspice
publisher: Analog Devices
description: LTspice® is a powerful, fast, and free SPICE simulator software, schematic capture and waveform viewer with enhancements and models for improving the simulation of analog circuits.
dependentApplicationBlacklist:
 - "LTSpice Config"
detectionType: msi
installExperience: system
restartBehavior: suppress
minOSVersion: W11_24H2
numVersionsToKeep: 2
scopeTags:
  - scopeTag1
  - scopeTag2
