url: https://github.com/Ultimaker/Cura
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'UltiMaker-Cura-.*-win64-X64\.msi$', '[0-9]+\.[0-9]+\.[0-9]+')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: ultimakercura.png
id: ultimakercura
displayName: UltiMaker Cura
publisher: UltiMaker
description: UltiMaker Cura is an open-source slicing application for preparing models for 3D printing.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
