url: https://mkvtoolnix.download/windows/releases/
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $baseUrl = 'https://mkvtoolnix.download/windows/releases/'
  $page = Invoke-WebRequest -Uri $baseUrl -UseBasicParsing -ErrorAction Stop
  $versions = [regex]::Matches($page.Content, 'href="\./([0-9]+(?:\.[0-9]+){1,3})/"') | ForEach-Object { $_.Groups[1].Value }
  $version = ($versions | Sort-Object { [version]$_ } -Descending | Select-Object -First 1)
  if (-not $version) { throw 'Could not determine the latest MKVToolNix version.' }
  $releasePage = Invoke-WebRequest -Uri "$baseUrl$version/" -UseBasicParsing -ErrorAction Stop
  $match = [regex]::Match($releasePage.Content, 'href="\./([^"/]*mkvtoolnix-64-bit-[^"/]*-setup\.exe)"')
  if (-not $match.Success) { throw 'Could not find the MKVToolNix 64-bit setup executable.' }
  $fileName = $match.Groups[1].Value
  $url = "$baseUrl$version/$fileName"
  $registryDetectionValue = $version
installScript: <filename> /S
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'MKVToolNix*' -and $_.UninstallString } |
    Select-Object -First 1

  $exe = if ($app) {
    # UninstallString may carry arguments, so pull just the executable path out.
    $raw = [string]$app.UninstallString
    if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  } else {
    (Get-ChildItem -Path (Join-Path $env:ProgramFiles 'MKVToolNix') -Filter 'uninstall*.exe' -ErrorAction SilentlyContinue |
      Select-Object -First 1).FullName
  }

  if (-not $exe -or -not (Test-Path -LiteralPath $exe)) { throw 'Could not find the MKVToolNix uninstaller.' }
  $installDir = Split-Path -Parent $exe

  Start-Process -FilePath $exe -ArgumentList '/S', "_?=$installDir" -Wait

  # With _?= NSIS leaves the uninstaller folder, the ARP entry and the
  # Start Menu shortcuts behind, so clean those up explicitly.
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
  if ($app) { Remove-Item -LiteralPath $app.PSPath -Recurse -Force -ErrorAction SilentlyContinue }
  Get-ChildItem -Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs') -Directory -ErrorAction SilentlyContinue |
    Where-Object { $_.Name -like 'MKVToolNix*' } |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
iconFile: mkvtoolnix.png
id: mkvtoolnix
displayName: MKVToolNix
publisher: Moritz Bunkus
description: MKVToolNix is a set of tools to create, alter, inspect, and manipulate Matroska media files.
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      $found = $null
      if ($props.DisplayName -like 'MKVToolNix*' -and [version]::TryParse([string]$props.DisplayVersion, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
