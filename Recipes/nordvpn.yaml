url: https://downloads.nordcdn.com/apps/windows/NordVPN/latest/NordVPNInstall.exe
urlRedirects: false
preDownloadScript: |
  $url = 'https://downloads.nordcdn.com/apps/windows/NordVPN/latest/NordVPNInstall.exe'
  $fileName = 'NordVPNInstall.exe'
  $staged = Join-Path $env:TEMP 'Yardstick-nordvpn-NordVPNInstall.exe'
  Remove-Item -LiteralPath $staged -Force -ErrorAction SilentlyContinue
  Invoke-WebRequest -Uri $url -OutFile $staged -UseBasicParsing -ErrorAction Stop
  $raw = [string](Get-Item -LiteralPath $staged).VersionInfo.ProductVersion
  if ($raw -match '^\d+(?:\.\d+){1,3}') { $version = $Matches[0] }
  else { throw "Could not read a NordVPN version from the signed installer (got '$raw')." }
downloadScript: |
  Move-Item -LiteralPath (Join-Path $env:TEMP 'Yardstick-nordvpn-NordVPNInstall.exe') -Destination (Join-Path $PWD $fileName) -Force
fileType: exe
installScript: <filename> /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'NordVPN*' -and $_.UninstallString } |
    Select-Object -First 1
  if (-not $app) { exit 0 }
  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { throw "Could not parse NordVPN uninstall command '$raw'." }
  if (-not (Test-Path -LiteralPath $exe)) { throw "NordVPN uninstaller not found at '$exe'." }
  $process = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
  if ($process.ExitCode -notin 0, 3010) { throw "NordVPN uninstaller exited with $($process.ExitCode)." }
iconFile: nordvpn.png
id: nordvpn
displayName: NordVPN
publisher: Nord Security
description: NordVPN provides encrypted VPN connectivity, threat protection, and secure access to private and public networks.
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'NordVPN*' } |
    Select-Object -First 1
  $found = $null
  if ($app -and [version]::TryParse(([string]$app.DisplayVersion -replace '[^0-9.].*$',''), [ref]$found) -and $found -ge $expected) {
    Write-Output 'Detected'
    exit 0
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
maximumInstallationTimeInMinutes: 60
