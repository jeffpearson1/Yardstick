url: https://desktop.figma.com/win/Figma-0.0.0.msi
urlRedirects: false
preDownloadScript: |
  $feed = [xml]((Invoke-WebRequest -Uri 'https://desktop.figma.com/win/releases.xml' -UseBasicParsing).Content)
  $latest = @($feed.rss.channel.item)[0]
  $version = ([string]$latest.title -replace '^Figma\s+', '').Trim()
  $url = [string]$latest.link
  $fileName = [IO.Path]::GetFileName(([Uri]$url).AbsolutePath)
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: figma.png
id: figma
displayName: Figma
publisher: Figma, Inc.
description: Figma is a collaborative interface-design and prototyping application.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
