url: https://download.sassafras.com/software/release/current/Installers/Windows/Client/ksp-client-x64.exe
urlRedirects: false
preDownloadScript: |
  $vurl = "https://solutions.teamdynamix.com/TDClient/1965/Portal/KB/Article/169236/Current-ITAM-Downloads"
  $content = Invoke-WebRequest -Uri $vurl -UseBasicParsing
  if ($content.Content -match "(?<=Minor Version:<\/strong>\s)([0-9]+\.){2,3}[0-9]+") {
    $Script:version = $matches[0]
    $Script:fileDetectionVersion = $Script:version
  } else {
    throw "Could not determine current TeamDynamix ITAM client version from $vurl"
  }
installScript: <filename> -q -v PROP_HOSTNAME=https://<your_org>.sassafrascloud.com -v PROP_TRUST=10 -v PROP_SECURITY=2 -v PROP_NOURL=0 -v PROP_FORCEHOST=1
powerShellUninstallScript: |
  $uninstallKeys = @(
    "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
    "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
  )
  $entry = Get-ItemProperty -Path $uninstallKeys -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -eq "Sassafras KeyServer Platform Client" } |
    Select-Object -First 1
  if (-not $entry) {
    throw "Could not find Sassafras KeyServer Platform Client uninstall entry in the registry."
  }
  $uninstallString = $entry.UninstallString
  if (-not $uninstallString) {
    throw "Uninstall entry for '$($entry.DisplayName)' has no UninstallString."
  }
  # Get the MSI product code from the uninstall string
  if ($uninstallString -match "MsiExec\.exe /[Xx]\{([A-F0-9\-]+)\}") {
    $productCode = $matches[1]
    $msiArgs = "/x{$productCode} /qn /norestart"
    $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $msiArgs -Wait -PassThru
    if ($process.ExitCode -notin @(0, 3010)) {
      exit $process.ExitCode
    }
  } else {
    throw "UninstallString does not contain an MSI product code: $uninstallString"
  }
