url: https://github.com/cryptomator/cryptomator
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'Cryptomator-[0-9.]+-x64\.msi$', '[0-9]+\.[0-9]+\.[0-9]+')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: cryptomator.png
id: cryptomator
displayName: Cryptomator
publisher: Skymatic GmbH
description: Cryptomator provides transparent client-side encryption for files stored in cloud-synchronized folders.
fileType: MSI
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
