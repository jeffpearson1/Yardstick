# FreeFileSync only supports silent installation for Business Edition, and the public edition's
# license forbids wrapping its installer inside another archive. Stage the licensed Business
# installer in <SoftwareDropbox>\freefilesync; do not substitute the public installer.
manualDownload: true
manualDownloadFolder: freefilesync
preDownloadScript: |
  if (-not (Get-Variable -Name dropboxPath -ErrorAction SilentlyContinue)) { $dropboxPath = '<SoftwareDropbox>\freefilesync' }
  if (-not (Get-Variable -Name dropboxFiles -ErrorAction SilentlyContinue)) { $dropboxFiles = @() }
  $installer = $dropboxFiles |
    Where-Object { $_.Name -match '^FreeFileSync_(?<version>\d+(?:\.\d+)+)_\[Business\]_Windows_Setup\.exe$' } |
    Sort-Object LastWriteTime -Descending |
    Select-Object -First 1
  if (-not $installer) {
    throw "No licensed FreeFileSync Business installer was found in $dropboxPath. Expected FreeFileSync_<version>_[Business]_Windows_Setup.exe."
  }
  if ($installer.Name -notmatch '^FreeFileSync_(?<version>\d+(?:\.\d+)+)_\[Business\]_Windows_Setup\.exe$') {
    throw "Could not determine the FreeFileSync Business version from '$($installer.Name)'."
  }
  $version = $Matches['version']
  $fileName = $installer.Name
  $url = $installer.FullName
fileType: exe
installScript: <filename> /silent
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'FreeFileSync*' -and $_.UninstallString } |
    Select-Object -First 1
  if (-not $app) { exit 0 }
  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { throw "Could not parse FreeFileSync uninstall command '$raw'." }
  if (-not (Test-Path -LiteralPath $exe)) { throw "FreeFileSync uninstaller not found at '$exe'." }
  $process = Start-Process -FilePath $exe -ArgumentList '/silent' -Wait -PassThru
  if ($process.ExitCode -notin 0, 3010) { throw "FreeFileSync uninstaller exited with $($process.ExitCode)." }
iconFile: freefilesync.png
id: freefilesync
displayName: FreeFileSync Business Edition
publisher: FreeFileSync.org
description: FreeFileSync compares and synchronizes files and folders; this recipe requires the licensed Business Edition installer for supported silent deployment.
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'FreeFileSync*' } |
    Select-Object -First 1
  $found = $null
  if ($app -and [version]::TryParse(([string]$app.DisplayVersion -replace '[^0-9.].*$',''), [ref]$found) -and $found -ge $expected) {
    Write-Output 'Detected'
    exit 0
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
