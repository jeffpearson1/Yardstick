url: https://github.com/peazip/PeaZip/releases
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/peazip/PeaZip/releases/latest' -Headers @{ 'User-Agent' = 'YardstickRecipe' } -ErrorAction Stop
  $asset = $release.assets |
    Where-Object { $_.name -match '^peazip-[0-9]+(?:\.[0-9]+)+\.WIN64\.exe$' } |
    Select-Object -First 1
  if (-not $asset) { throw 'Could not find the PeaZip x64 Windows installer EXE asset.' }
  $match = [regex]::Match($asset.name, '^peazip-(?<version>[0-9]+(?:\.[0-9]+)+)\.WIN64\.exe$')
  if (-not $match.Success) { throw "Could not parse PeaZip version from '$($asset.name)'." }
  $version = $match.Groups['version'].Value
  $url = $asset.browser_download_url
  $fileName = $asset.name
# Latest PeaZip release currently has WIN64 EXE and MSIX assets, but no MSI; the WIN64 EXE is Inno Setup by .itext+.bss section evidence.
installScript: <filename> /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'PeaZip*' -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the PeaZip uninstaller registry entry.' }

  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "PeaZip uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe

  $process = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
  if ($process.ExitCode -ne 0) { throw "PeaZip uninstaller exited with $($process.ExitCode)." }

  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
iconFile: peazip.png
id: peazip
displayName: PeaZip
publisher: Giorgio Tani
description: PeaZip is a free and open-source file archiver and compression utility.
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notlike 'PeaZip*') { continue }
      $text = ([string]$props.DisplayVersion) -replace '\s.*$', ''
      $found = $null
      if ([version]::TryParse($text, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
