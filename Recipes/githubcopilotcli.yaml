url: https://github.com/github/copilot-cli
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloadFileRegex = "copilot-x64\.msi$"
  $versionRegex = "[0-9]+(\.[0-9]+){2}"
  $Script:downloader = [GithubDownloader]::new($url, $downloadFileRegex, $versionRegex)
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.filename
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: githubcopilotcli.png
id: githubcopilotcli
displayName: GitHub Copilot CLI
publisher: GitHub, Inc.
description: GitHub Copilot CLI brings the Copilot coding agent to the terminal, so you can build, debug, and understand code using natural language without leaving the command line.
fileType: msi
detectionType: msi
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
architecture: x64
