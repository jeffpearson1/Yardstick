url: https://download01.logi.com/web/ftp/pub/techsupport/optionsplus/logioptionsplus_installer_offline.exe
urlRedirects: false
preDownloadScript: |
  $url = 'https://download01.logi.com/web/ftp/pub/techsupport/optionsplus/logioptionsplus_installer_offline.exe'
  $fileName = 'logioptionsplus_installer_offline.exe'
  $staged = Join-Path $env:TEMP 'Yardstick-logitechoptionsplus-offline.exe'
  Remove-Item -LiteralPath $staged -Force -ErrorAction SilentlyContinue
  Invoke-WebRequest -Uri $url -OutFile $staged -UseBasicParsing -ErrorAction Stop
  $raw = [string](Get-Item -LiteralPath $staged).VersionInfo.ProductVersion
  if ($raw -match '^\d+(?:\.\d+){1,3}') { $version = $Matches[0] }
  else { throw "Could not read a Logi Options+ version from the signed offline installer (got '$raw')." }
downloadScript: |
  Move-Item -LiteralPath (Join-Path $env:TEMP 'Yardstick-logitechoptionsplus-offline.exe') -Destination (Join-Path $PWD $fileName) -Force
fileType: exe
powerShellInstallScript: |
  $installer = (Resolve-Path -LiteralPath '.\<filename>').ProviderPath
  $process = Start-Process -FilePath $installer -ArgumentList '/quiet', '/analytics', 'no', '/flow', 'no', '/sso', 'no', '/update', 'no' -Wait -PassThru
  if ($process.ExitCode -in 0, 3010) { exit 0 }

  # Some Windows Server builds return 1008 after the app has been installed successfully.
  # Confirm the actual ARP state before deciding whether the nonstandard exit is fatal.
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'Logi Options+*' } |
    Select-Object -First 1
  if (-not $app) { throw "Logi Options+ installer exited with $($process.ExitCode) and the app was not detected." }
powerShellUninstallScript: |
  $installer = (Resolve-Path -LiteralPath '.\<filename>').ProviderPath
  $process = Start-Process -FilePath $installer -ArgumentList '/quiet', '/uninstall' -Wait -PassThru
  # The vendor bundle can crash after it has already removed every component. Treat that as
  # success only when its ARP registration is actually gone; otherwise preserve the failure.
  $deadline = (Get-Date).AddMinutes(3)
  do {
    $app = Get-ItemProperty -Path @(
        'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
        'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
      ) -ErrorAction SilentlyContinue |
      Where-Object { $_.DisplayName -like 'Logi Options+*' } |
      Select-Object -First 1
    if (-not $app) { exit 0 }
    Start-Sleep -Seconds 5
  } while ((Get-Date) -lt $deadline)
  throw "Logi Options+ uninstaller exited with $($process.ExitCode) and the app remains registered."
iconFile: logitechoptionsplus.png
id: logitechoptionsplus
displayName: Logi Options+
publisher: Logitech
description: Logi Options+ customizes supported Logitech mice, keyboards, buttons, gestures, and application-specific actions.
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'Logi Options+*' } |
    Select-Object -First 1
  $found = $null
  if ($app -and [version]::TryParse(([string]$app.DisplayVersion -replace '[^0-9.].*$',''), [ref]$found) -and $found -ge $expected) {
    Write-Output 'Detected'
    exit 0
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
maximumInstallationTimeInMinutes: 60
