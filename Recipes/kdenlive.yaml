url: https://download.kde.org/stable/kdenlive/
urlRedirects: false
preDownloadScript: |
  using module .\Modules\VersionPro.psm1
  $baseUrl = 'https://download.kde.org/stable/kdenlive/'
  $page = Invoke-WebRequest -Uri $baseUrl -UseBasicParsing -ErrorAction Stop
  $versions = [regex]::Matches($page.Content, 'href="([0-9]+\.[0-9]+(?:\.[0-9]+)?/)"') | ForEach-Object { $_.Groups[1].Value.TrimEnd('/') }
  $releaseDir = ($versions | Sort-Object { [version]$_ } -Descending | Select-Object -First 1)
  if (-not $releaseDir) { throw 'Could not determine the latest Kdenlive release directory.' }
  $windowsUrl = "$baseUrl$releaseDir/windows/"
  $windowsPage = Invoke-WebRequest -Uri $windowsUrl -UseBasicParsing -ErrorAction Stop
  $matches = [regex]::Matches($windowsPage.Content, 'href="([^"/]*kdenlive-([0-9]+\.[0-9]+\.[0-9]+)\.exe)"')
  $match = $matches | Select-Object -First 1
  if (-not $match) { throw 'Could not find the Kdenlive Windows installer.' }
  $fileName = $match.Groups[1].Value
  $version = $match.Groups[2].Value
  $url = "$windowsUrl$fileName"
  $fileDetectionVersion = [VersionPro]::new($version).ToString(4)
installScript: <filename> /S
powerShellUninstallScript: |
  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'Kdenlive*' -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $app) { throw 'Could not find the Kdenlive uninstaller registry entry.' }

  # UninstallString may carry arguments (e.g. '"...uninstall.exe" /AllUsers'),
  # so pull just the executable path out of it.
  $raw = [string]$app.UninstallString
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { $raw.Trim('"') }
  if (-not (Test-Path -LiteralPath $exe)) { throw "Kdenlive uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe

  Start-Process -FilePath $exe -ArgumentList '/S', "_?=$installDir" -Wait

  # With _?= NSIS leaves the uninstaller folder, the ARP entry and the
  # Start Menu shortcuts behind, so clean those up explicitly.
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
  Remove-Item -LiteralPath $app.PSPath -Recurse -Force -ErrorAction SilentlyContinue
  Get-ChildItem -Path (Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs') -Directory -ErrorAction SilentlyContinue |
    Where-Object { $_.Name -like 'Kdenlive*' } |
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
iconFile: kdenlive.png
id: kdenlive
displayName: Kdenlive
publisher: KDE
description: Kdenlive is a free and open-source non-linear video editor built on the KDE and MLT frameworks.
detectionType: script
detectionScript: |
  # kdenlive.exe ships without a version resource, so file/version detection can
  # never match. Detect via the ARP entry instead.
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      $found = $null
      if ($props.DisplayName -like 'Kdenlive*' -and [version]::TryParse([string]$props.DisplayVersion, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
