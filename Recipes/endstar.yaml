# Endstar is installed and updated by the Endless Launcher, so this packages the launcher installer
# that the vendor publishes (Endstar Wiki "Installation Guide"). The game itself is downloaded by the
# launcher on first use. The installer is an Inno Setup 6 package. The vendor publishes no version
# feed, so the version is read from the installer's own ProductVersion.
url: https://launcher.endlessstudios.com/Installers/pc/Endless+Launcher+Installer.exe
urlRedirects: false
preDownloadScript: |
  $launcherTemp = Join-Path $Temp 'endstar-launcher-installer.exe'
  Remove-Item -LiteralPath $launcherTemp -Force -ErrorAction SilentlyContinue
  Invoke-WebRequest -Uri $url -OutFile $launcherTemp -UseBasicParsing
  $raw = [string](Get-Item -LiteralPath $launcherTemp).VersionInfo.ProductVersion
  if ($raw.Trim() -notmatch '^(?<ver>[0-9]+(?:\.[0-9]+)+)') {
      throw "Could not read a version from the Endless Launcher installer ('$raw')."
  }
  $version = $Matches['ver']
  $fileName = 'EndlessLauncherInstaller.exe'
downloadScript: |
  Move-Item -LiteralPath (Join-Path $Temp 'endstar-launcher-installer.exe') -Destination (Join-Path $PWD.Path $fileName) -Force
installScript: <filename> /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS
powerShellUninstallScript: |
  Get-Process -Name 'Endless Launcher', 'Endstar' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

  $app = Get-ItemProperty -Path @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    ) -ErrorAction SilentlyContinue |
    Where-Object { $_.DisplayName -like 'Endless Launcher*' -and $_.UninstallString } |
    Select-Object -First 1

  if (-not $app) { Write-Output 'Endless Launcher is not installed.'; exit 0 }

  $raw = [string]$(if ($app.QuietUninstallString) { $app.QuietUninstallString } else { $app.UninstallString })
  $exe = if ($raw -match '^\s*"([^"]+)"') { $Matches[1] }
    elseif ($raw -match '^\s*(.+?\.exe)(\s|$)') { $Matches[1] }
    else { throw "Could not parse uninstall command '$raw'." }
  if (-not (Test-Path -LiteralPath $exe)) { throw "Endless Launcher uninstaller not found at '$exe'." }
  $installDir = Split-Path -Parent $exe

  $process = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
  if ($process.ExitCode -ne 0) { throw "Endless Launcher uninstaller exited with $($process.ExitCode)." }

  # The launcher downloads Endstar into its own directory, which the uninstaller does not track.
  Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
iconFile: endstar.png
id: endstar
displayName: Endstar
publisher: Endless Studios
description: Endstar is a collaborative 3D game-creation engine. This installs the Endless Launcher, which downloads and updates Endstar.
fileType: exe
detectionType: script
detectionScript: |
  $expected = [version]'<version>'
  $roots = @(
    'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
  )
  foreach ($root in $roots) {
    foreach ($entry in @(Get-ChildItem -Path $root -ErrorAction SilentlyContinue)) {
      $props = Get-ItemProperty -Path $entry.PSPath -ErrorAction SilentlyContinue
      if ($props.DisplayName -notlike 'Endless Launcher*') { continue }
      $text = ([string]$props.DisplayVersion) -replace '\s.*$', ''
      $found = $null
      if ([version]::TryParse($text, [ref]$found) -and $found -ge $expected) {
        Write-Output 'Detected'
        exit 0
      }
    }
  }
  Write-Output 'Not Detected'
  exit 1
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
