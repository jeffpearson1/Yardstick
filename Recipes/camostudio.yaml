url: https://api.reincubate.com/apps/camo/
urlRedirects: false
preDownloadScript: |
  # Reincubate's public app API, which is what camo.com itself reads. The
  # release-notes page this used to scrape was rebuilt on Nuxt 3 and no longer
  # carries a <script id="js-settings"> blob - the payload is now flattened into
  # __NUXT_DATA__, where objects are index references that have to be resolved
  # before anything can be read out of them. The API returns the same data
  # already shaped. Never pin a version here.
  $release = Invoke-RestMethod -Uri $url -ErrorAction Stop
  if (-not $release) { throw 'No release metadata was returned by the Reincubate app API.' }
  # Windows and macOS ship on separate release trains, so read the Windows entry
  # rather than latest_release, which follows whichever platform shipped last.
  $version = [string]$release.latest_downloads.windows.release.version
  if ($version -notmatch '^[0-9]+(\.[0-9]+){1,3}$') { throw "Unexpected Camo Studio version string '$version'." }
  # Deliberately not $release.latest_downloads.windows.url: that is now a
  # Microsoft Store bootstrapper ("Camo Studio Installer.exe", ~800 KB) which
  # installs an MSIX through the Store and cannot be packaged as a Win32 app.
  # The MSI below is the same build - verified ProductVersion 2.9.1.25575 against
  # the API's 2.9.1.25575, signed by REINCUBATE LIMITED, ALLUSERS=1. The API
  # also lists this URL under an "amd-ryzen-ai" beta channel whose release
  # metadata is stale; the file it serves is current mainline.
  # reincubate.com/res/labs/camo/... 301s here; using the target directly keeps
  # this working with urlRedirects: false.
  $url = 'https://releases.reincubate.com/camo/camo-windows-latest.msi'
  $fileName = 'camo-windows-latest.msi'
postDownloadScript: |
  # The URL is unversioned, so the only thing tying the payload to the version
  # the API reported is this check. A mismatch means the API moved ahead of the
  # file (or behind it), and publishing would label the package with a version
  # Intune would then never detect.
  $msiProductVersion = ([string](Get-MsiProperty -Path (Join-Path $PWD $fileName) -PropertyName ProductVersion)).Trim()
  if ($msiProductVersion -ne $version) {
    throw "Camo Studio MSI is ProductVersion $msiProductVersion but the API reported $version. The unversioned download URL has drifted from the API."
  }
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: camostudio.png
id: camostudio
displayName: Camo Studio
publisher: Reincubate Ltd
description: Camo Studio turns phones and cameras into configurable webcams for meetings, streaming, and recording.
detectionType: msi
