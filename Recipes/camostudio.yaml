url: https://camo.com/support/camo/release-notes?platform=windows
urlRedirects: false
preDownloadScript: |
  # Official Camo release-notes page embeds machine-readable release JSON. Never pin a version here.
  $html = (Invoke-WebRequest -Uri $url -UseBasicParsing).Content
  if ($html -is [byte[]]) { $html = [System.Text.Encoding]::UTF8.GetString($html) }
  $embedded = [regex]::Match($html, '(?s)<script id="js-settings" type="application/json">(?<json>.*?)</script>')
  if (-not $embedded.Success) { throw 'No release metadata was found on the official Camo release-notes page.' }
  # Windows and macOS release trains differ, so read the Windows entry specifically.
  $version = [string](($embedded.Groups['json'].Value | ConvertFrom-Json).page.app.latest_downloads.windows.release.version)
  if ($version -notmatch '^[0-9]+(\.[0-9]+)+$') { throw "Unexpected Camo Studio version string '$version'." }
  $url = 'https://reincubate.com/res/labs/camo/camo-windows-latest.msi'
  $fileName = 'camo-windows-latest.msi'
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: camostudio.png
id: camostudio
displayName: Camo Studio
publisher: Reincubate Ltd
description: Camo Studio turns phones and cameras into configurable webcams for meetings, streaming, and recording.
detectionType: msi
