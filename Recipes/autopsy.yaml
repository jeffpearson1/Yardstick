url: https://github.com/sleuthkit/autopsy
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'autopsy-.*-64bit\.msi$', '[0-9]+\.[0-9]+\.[0-9]+')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: autopsy.png
id: autopsy
displayName: Autopsy
publisher: The Sleuth Kit
description: Autopsy is an open-source digital-forensics platform for examining disks, file systems, and mobile-device data.
detectionType: msi
