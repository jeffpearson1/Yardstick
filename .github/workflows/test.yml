name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pester Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install modules
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -Scope CurrentUser
          Install-Module -Name powershell-yaml -Force -Scope CurrentUser

      - name: Validate module manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./Yardstick.psd1 -ErrorAction Stop | Format-List Name, Version, RootModule, ExportedFunctions

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $config = New-PesterConfiguration
          $config.Run.Path = "Tests/Unit/"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "testResults.xml"
          $config.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: testResults.xml

  lint:
    name: PSScriptAnalyzer Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $excludeRules = @(
            'PSAvoidUsingWriteHost',
            'PSUseShouldProcessForStateChangingFunctions'
          )

          # Every shipped script and module, so a new file cannot be left out.
          $files = @(git ls-files '*.ps1' '*.psm1' | Where-Object { $_ -notlike 'Tests/*' })
          if (-not $files) { throw 'No PowerShell files found to lint.' }

          $hasErrors = $false
          $warningCount = 0
          foreach ($file in $files) {
            $results = Invoke-ScriptAnalyzer -Path $file -Severity Error,Warning -ExcludeRule $excludeRules
            if ($results) {
              foreach ($r in $results) {
                $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
                Write-Host "::${level} file=${file},line=$($r.Line)::[$($r.RuleName)] $($r.Message)"
                if ($r.Severity -eq 'Error') { $hasErrors = $true } else { $warningCount++ }
              }
            }
          }

          "Linted $($files.Count) files: $warningCount warning(s)." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($hasErrors) {
            throw "PSScriptAnalyzer found errors"
          }

  validate-recipes:
    name: Validate Recipe Schemas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install powershell-yaml
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name powershell-yaml -Force -Scope CurrentUser

      - name: Validate all recipes
        shell: pwsh
        run: pwsh -File Tests/Unit/Test-AllRecipes.ps1
