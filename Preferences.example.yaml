#####################################
# YARDSTICK CONFIG
#####################################


#####################################
# DEFAULT FOLDER LOCATIONS
#####################################
Test: <REPLACE_WITH_YARDSTICK_ROOT>\Test
Buildspace: <REPLACE_WITH_YARDSTICK_ROOT>\Buildspace
Scripts: <REPLACE_WITH_YARDSTICK_ROOT>\Scripts
Published: <REPLACE_WITH_YARDSTICK_ROOT>\Published
Recipes: <REPLACE_WITH_YARDSTICK_ROOT>\Recipes
Icons: <REPLACE_WITH_YARDSTICK_ROOT>\Icons
Tools: <REPLACE_WITH_YARDSTICK_ROOT>\Tools
Temp: <REPLACE_WITH_YARDSTICK_ROOT>\Temp
Secrets: <REPLACE_WITH_YARDSTICK_ROOT>\Secrets
Modules: <REPLACE_WITH_YARDSTICK_ROOT>\Modules


#####################################
# INTUNE CONNECTION SETTINGS
#####################################
TenantID: 
ClientSecret: 
ClientId: 


#####################################
# PACKAGED APPLICATION DEFAULTS
#####################################
defaultNumVersionsToKeep: 2
# Whether the newest uploaded version declares Intune-native supersedence over
# all kept older versions. Recipes can override with `supersedence`.
defaultSupersedence: true
# If true, supersedence uses "Replace" (Intune uninstalls the prior version
# before installing the new one). If false, uses "Update" (in-place upgrade).
# Recipes can override with `uninstallPreviousVersion`.
defaultUninstallPreviousVersion: false
# If true, Yardstick enables Intune's native auto-update
# (settings.autoUpdateSettings.autoUpdateSupersededAppsState = enabled) on the
# newest app's *available* assignments, so Intune pushes it to devices that
# already have a superseded version installed. Intune only honours auto-update
# for available assignments, so required-only recipes are unaffected. Recipes
# can override with `autoUpdateOnAssignment` (accepted alias: `autoUpdate`).
defaultAutoUpdate: true
# Master switch for the {DETECT} anchor behavior. When enabled, the first time
# Yardstick updates a version-detection app under the new model, the oldest
# surviving version is renamed "{DETECT} <DisplayName>" and preserved so it
# continues to detect long-abandoned installs. The anchor is always a
# supersedence target of the newest version, always with type "Update".
useDetectAnchor: true
defaultOwner:
defaultMaximumInstallationTimeInMinutes: 60
defaultMinOSVersion: W10_20H2
defaultInstallExperience: system
defaultRestartBehavior: suppress
defaultAllowUserUninstall: true
defaultIs32BitApp: false
defaultArchitecture: none
defaultRequiresApproval: false
defaultDetectionScriptFileExtension: ps1
defaultDetectionScriptRunAs32Bit: false
defaultDetectionScriptEnforceSignatureCheck: false
defaultDeadlineDateOffset: 0
defaultAvailableDateOffset: 0
defaultScopeTags:
  - Scope Tags Go Here (Can be Multiple)
defaultDeploymentGroups:
  - Group IDs go here and will receive a default available deployment for testing purposes


#####################################
# EMAIL NOTIFICATION SETTINGS
#####################################
emailNotificationEnabled: false
emailRecipient: "admin@yourorganization.com"
emailSubject: "Yardstick Application Update Report"
emailSenderName: "Yardstick Automation"
emailSendFromAddress: "noreply@yourorganization.com"

#####################################
# DEPENDENT LINK UPDATE SETTINGS
#####################################
dependentLinkUpdateEnabled: true
dependentLinkUpdateRetryCount: 3
dependentLinkUpdateRetryDelaySeconds: 5
dependentLinkUpdateTimeoutSeconds: 60
dependentApplicationBlacklist:
  - "Example Dependent App Name to Exclude"