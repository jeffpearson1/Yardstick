url: https://github.com/godotengine/godot
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'Godot_v.*_win64\.exe\.zip$', '[0-9]+\.[0-9]+(?:\.[0-9]+)?')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
  $fileDetectionPath = "C:\Program Files\Godot\$version"
  # fileDetectionName is NOT placeholder-expanded by Yardstick, so derive it here.
  # The release asset is <exe>.zip, so the packaged exe is the filename minus .zip.
  $fileDetectionName = $fileName -replace '\.zip$', ''
powerShellInstallScript: |
  $target = 'C:\Program Files\Godot\<version>'
  New-Item -ItemType Directory -Path $target -Force | Out-Null
  Expand-Archive -LiteralPath '.\<filename>' -DestinationPath $target -Force
powerShellUninstallScript: |
  Remove-Item -LiteralPath 'C:\Program Files\Godot\<version>' -Recurse -Force -ErrorAction SilentlyContinue
  # Remove the shared parent only once the last version has been uninstalled.
  $root = 'C:\Program Files\Godot'
  if ((Test-Path -LiteralPath $root) -and -not (Get-ChildItem -LiteralPath $root -Force)) {
    Remove-Item -LiteralPath $root -Force -ErrorAction SilentlyContinue
  }
iconFile: godot.png
id: godot
displayName: Godot Engine
publisher: Godot Engine
description: Godot is a free and open-source game engine for creating 2D and 3D applications.
detectionType: file
fileDetectionPath:
fileDetectionName:
fileDetectionMethod: exists
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
