url: https://c.1password.com/dist/1P/win8/1PasswordSetup-latest.msi
urlRedirects: false
preDownloadScript: |
  $fileName = '1PasswordSetup-latest.msi'
  $stagedInstaller = Join-Path $Temp $fileName
  Start-BitsTransfer -Source $url -Destination $stagedInstaller
  $version = ([string](Get-MsiProperty -Path $stagedInstaller -PropertyName ProductVersion)).Trim()
  if ([string]::IsNullOrWhiteSpace($version)) {
    throw '1Password installer ProductVersion was empty.'
  }
downloadScript: |
  Copy-Item -LiteralPath (Join-Path $Temp $fileName) -Destination (Join-Path (Get-Location) $fileName) -Force
fileName: 1PasswordSetup-latest.msi
installScript: msiexec /i <filename> /qn /norestart MANAGED_INSTALL=1 MANAGED_UPDATE=1
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: 1password.png
id: 1password
displayName: 1Password
publisher: 1Password
description: 1Password is an enterprise password manager for credentials, passkeys, secure notes, and shared vaults.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
