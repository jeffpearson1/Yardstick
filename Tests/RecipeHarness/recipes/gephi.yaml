url: https://github.com/gephi/gephi
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'gephi-.*-windows-x64\.exe$', '[0-9]+\.[0-9]+\.[0-9]+')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
  $fileDetectionVersion = Format-FileDetectionVersion $version
  $fileDetectionPath = "C:\Program Files\Gephi-$version\bin"
installScript: <filename> /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
uninstallScript: '"%ProgramFiles%\Gephi-<version>\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
iconFile: gephi.png
id: gephi
displayName: Gephi
publisher: Gephi Consortium
description: Gephi is an open-source application for exploring, analyzing, and visualizing networks and graphs.
detectionType: file
fileDetectionPath:
fileDetectionName: gephi64.exe
fileDetectionMethod: version
fileDetectionVersion:
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
