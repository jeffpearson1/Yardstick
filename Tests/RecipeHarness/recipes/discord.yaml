url: https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64
urlRedirects: true
preDownloadScript: |
  # Official Discord stable distribution endpoint. Never pin a version here.
  # Yardstick resolves the 302 first, so $url carries the current build number.
  if ($url -notmatch '/stable/win/x64/(?<ver>[0-9]+(?:\.[0-9]+)+)/DiscordSetup\.exe$') {
      throw "The official Discord installer endpoint did not resolve to a versioned x64 build: '$url'."
  }
  $version = $Matches['ver']
  $fileName = 'DiscordSetup.exe'

  # Discord is a Squirrel app: the launcher lives in a per-version folder
  # (%LocalAppData%\Discord\app-<version>\Discord.exe) and only the Update.exe
  # stub sits at the root. fileDetectionPath does not take <version>
  # substitution, so build the versioned path here instead.
  $fileDetectionPath = "%LocalAppData%\Discord\app-$version"
installScript: <filename> -s
uninstallScript: '"%LocalAppData%\Discord\Update.exe" --uninstall -s'
iconFile: discord.png
id: discord
displayName: Discord
publisher: Discord Inc.
description: Discord is a desktop communication client for text, voice, video, and community collaboration.
detectionType: file
fileDetectionPath: '%LocalAppData%\Discord'  # replaced at build time with the app-<version> folder
fileDetectionName: Discord.exe
fileDetectionMethod: version
fileDetectionVersion:
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: user
restartBehavior: suppress
minOSVersion: W10_20H2
