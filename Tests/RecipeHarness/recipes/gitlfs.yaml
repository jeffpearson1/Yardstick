url: https://github.com/git-lfs/git-lfs
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'git-lfs-windows-v.*\.exe$', '[0-9]+\.[0-9]+\.[0-9]+')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
  $fileDetectionVersion = Format-FileDetectionVersion $version
installScript: <filename> /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
uninstallScript: '"%ProgramFiles%\Git LFS\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
iconFile: gitlfs.png
id: gitlfs
displayName: Git Large File Storage
publisher: GitHub, Inc.
description: Git LFS extends Git to store large binary content outside ordinary repository objects.
detectionType: file
fileDetectionPath: '%ProgramFiles%\Git LFS'
fileDetectionName: git-lfs.exe
fileDetectionMethod: version
fileDetectionVersion:
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
