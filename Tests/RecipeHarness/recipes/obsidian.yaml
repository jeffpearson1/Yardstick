url: https://github.com/obsidianmd/obsidian-releases
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'Obsidian-[0-9.]+\.exe$', '[0-9]+\.[0-9]+\.[0-9]+')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
  if (-not $url -or -not $fileName) { throw 'No stable Obsidian Windows executable was found.' }
  $fileDetectionVersion = Format-FileDetectionVersion $version
installScript: <filename> /S
uninstallScript: '"%LocalAppData%\Programs\Obsidian\Uninstall Obsidian.exe" /S'
iconFile: obsidian.png
id: obsidian
displayName: Obsidian
publisher: Dynalist Inc.
description: Obsidian is a Markdown-based knowledge-management and note-taking application.
detectionType: file
fileDetectionPath: '%LocalAppData%\Programs\Obsidian'
fileDetectionName: Obsidian.exe
fileDetectionMethod: version
fileDetectionVersion:
fileDetectionOperator: greaterThanOrEqual
architecture: x64
installExperience: user
restartBehavior: suppress
minOSVersion: W10_20H2
