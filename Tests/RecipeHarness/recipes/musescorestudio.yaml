url: https://github.com/musescore/MuseScore
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'MuseScore-Studio-[0-9.]+\.[0-9]+-x86_64\.msi$', '[0-9]+\.[0-9]+\.[0-9]+')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
  if (-not $url -or -not $fileName) { throw 'No stable MuseScore Studio Windows x64 MSI was found.' }
  $fileDetectionVersion = Format-FileDetectionVersion $version
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: musescorestudio.png
id: musescorestudio
displayName: MuseScore Studio
publisher: Muse Group
description: MuseScore Studio is open-source software for creating, editing, and playing music notation.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
