url: https://github.com/processing/processing4
urlRedirects: false
preDownloadScript: |
  using module .\Modules\Custom\GithubDownloader.psm1
  $downloader = [GithubDownloader]::new($url, 'processing-[0-9.]+-windows-x64\.msi$', '[0-9]+\.[0-9]+\.[0-9]+')
  $downloader.Update()
  $version = $downloader.LatestVersion
  $url = $downloader.URL
  $fileName = $downloader.Filename
  if (-not $url -or -not $fileName) { throw 'No stable Processing Windows x64 MSI was found.' }
  $fileDetectionVersion = Format-FileDetectionVersion $version
installScript: msiexec /i <filename> /qn /norestart
uninstallScript: msiexec /x <productcode> /qn /norestart
iconFile: processing.png
id: processing
displayName: Processing
publisher: Processing Foundation
description: Processing is an open-source programming environment for visual arts and creative coding.
detectionType: msi
architecture: x64
installExperience: system
restartBehavior: suppress
minOSVersion: W10_20H2
